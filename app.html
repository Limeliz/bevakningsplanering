<title>Vaktplan</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: mörk sidopanel som kontrollrum + ljus arbetsyta; schemat är ett tidrutnät med statusfärgade passbrickor. */
:root{
  --bg:#e9edf2; --surface:#ffffff; --surface-2:#f4f6f9; --ink:#14202c; --muted:#5a6677; --line:#d3d9e1; --line-strong:#aab4c0;
  --side:#132030; --side-ink:#c4d0dd; --side-muted:#7f8fa1; --side-hover:#1d2f43;
  --accent:#f0b429; --accent-ink:#5a3f00; --accent-soft:#fcefcf;
  --ok:#1f7146; --ok-soft:#dff1e6; --warn:#985a00; --warn-soft:#fbebcf; --err:#b42318; --err-soft:#fbe2de; --info:#225694; --info-soft:#e0eaf7;
  --weekend:#eef1f6; --holiday:#fbe9e4;
  --font-head:'Barlow Semi Condensed','Arial Narrow',system-ui,sans-serif;
  --font-body:'Source Sans 3',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
  --radius:6px; --shadow:0 10px 40px rgba(10,20,35,.25);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0e141b; --surface:#16202b; --surface-2:#1c2835; --ink:#e3e9ef; --muted:#95a3b3; --line:#2a3746; --line-strong:#41516380;
  --side:#0a1017; --side-ink:#c4d0dd; --side-muted:#738497; --side-hover:#152230;
  --accent:#f2b938; --accent-ink:#f6cf6f; --accent-soft:#3a2e10;
  --ok:#5cc58b; --ok-soft:#173225; --warn:#f0a94a; --warn-soft:#3a2a12; --err:#f28b7f; --err-soft:#3d1a17; --info:#7fb0ec; --info-soft:#172b44;
  --weekend:#131c26; --holiday:#2c1a18; --shadow:0 10px 40px rgba(0,0,0,.6); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0e141b; --surface:#16202b; --surface-2:#1c2835; --ink:#e3e9ef; --muted:#95a3b3; --line:#2a3746; --line-strong:#41516380;
  --side:#0a1017; --side-ink:#c4d0dd; --side-muted:#738497; --side-hover:#152230;
  --accent:#f2b938; --accent-ink:#f6cf6f; --accent-soft:#3a2e10;
  --ok:#5cc58b; --ok-soft:#173225; --warn:#f0a94a; --warn-soft:#3a2a12; --err:#f28b7f; --err-soft:#3d1a17; --info:#7fb0ec; --info-soft:#172b44;
  --weekend:#131c26; --holiday:#2c1a18; --shadow:0 10px 40px rgba(0,0,0,.6); color-scheme:dark }

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45}
h1,h2,h3{font-family:var(--font-head);font-weight:700;letter-spacing:.01em;text-wrap:balance;margin:0}
h1{font-size:28px} h2{font-size:21px} h3{font-size:17px}
button,input,select,textarea{font:inherit;color:inherit}
.num,td.n,th.n{font-variant-numeric:tabular-nums}
.mono{font-family:var(--font-mono);font-size:.86em}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.side{background:var(--side);color:var(--side-ink);padding-block:18px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.brand-mark{width:30px;height:30px;border-radius:5px;background:var(--accent);display:grid;place-items:center;color:#1a1300;font-family:var(--font-head);font-weight:700;font-size:17px}
.brand b{font-family:var(--font-head);font-size:21px;color:#fff;letter-spacing:.02em}
.brand small{display:block;color:var(--side-muted);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.who{display:grid;gap:4px;padding:0 6px}
.who label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--side-muted)}
.who select{background:var(--side-hover);border:1px solid #2b3d52;color:#fff;border-radius:var(--radius);padding:7px 8px;width:100%}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:var(--radius);color:var(--side-ink);font-weight:600}
.nav button:hover{background:var(--side-hover)}
.nav button[aria-current="page"]{background:var(--side-hover);color:#fff;box-shadow:inset 3px 0 0 var(--accent)}
.nav button:focus-visible{outline:2px solid var(--accent)}
.nav .count{font-size:12px;background:var(--err);color:#fff;border-radius:10px;padding:0 7px;font-variant-numeric:tabular-nums}
.nav .count.amber{background:var(--accent);color:#1a1300}
.side-foot{margin-top:auto;font-size:12px;color:var(--side-muted);padding:0 6px}

.main{min-width:0;padding-block:22px 60px;padding-left:max(16px,2.2vw);padding-right:max(16px,env(safe-area-inset-right,0px),2.2vw)}
.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px}
.page-head p{margin:4px 0 0;color:var(--muted);max-width:70ch}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.eyebrow{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-strong);background:var(--surface);border-radius:var(--radius);padding:6px 12px;cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#1a1300}
.btn.primary:hover{filter:brightness(.95)}
.btn.danger{color:var(--err);border-color:var(--err)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:3px 8px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:var(--radius);overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 11px;cursor:pointer;font-weight:600;font-size:14px}
.seg button+button{border-left:1px solid var(--line-strong)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.panel-b{padding:14px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.stack{display:grid;gap:16px}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;display:grid;gap:2px}
.kpi .v{font-family:var(--font-head);font-size:32px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.kpi .l{color:var(--muted);font-size:13px}
.kpi.err .v{color:var(--err)} .kpi.amber .v{color:var(--warn)}

.tbl-wrap{overflow-x:auto}
table.tbl{border-collapse:collapse;width:100%;font-size:14px}
.tbl th{text-align:left;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl td.n,.tbl th.n{text-align:right;white-space:nowrap}
.tbl tr.total td{font-weight:700;border-top:2px solid var(--line-strong)}
.tbl tr.click{cursor:pointer} .tbl tr.click:hover td{background:var(--surface-2)}
.muted{color:var(--muted)} .small{font-size:13px}

.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:1px 8px;border-radius:999px;white-space:nowrap;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.err{background:var(--err-soft);color:var(--err);border-color:transparent}
.pill.info{background:var(--info-soft);color:var(--info);border-color:transparent}
.pill.amber{background:var(--accent-soft);color:var(--accent-ink);border-color:transparent}

/* Schemarutnät */
.sched{border-collapse:separate;border-spacing:0;font-size:13px;min-width:100%}
.sched th,.sched td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:4px;vertical-align:top}
.sched thead th{position:sticky;top:0;background:var(--surface-2);z-index:2;font-weight:700;text-align:left;white-space:nowrap;padding:6px}
.sched thead th .d{font-family:var(--font-head);font-size:15px}
.sched thead th .h{display:block;font-size:11px;color:var(--err);font-weight:600;white-space:normal;max-width:110px}
.sched .rowh{text-align:left;position:sticky;left:0;background:var(--surface);z-index:1;min-width:190px;max-width:220px}
.sched thead .rowh{z-index:3;background:var(--surface-2)}
.sched .rowh b{display:block;font-size:14px}
.sched .rowh span{color:var(--muted);font-size:12px}
.sched td{min-width:104px;background:var(--surface)}
.sched td.we{background:var(--weekend)} .sched td.hol{background:var(--holiday)}
.sched td.today,.sched th.today{box-shadow:inset 0 3px 0 var(--accent)}
.sched tr.site td,.sched tr.site th{background:var(--surface-2);font-family:var(--font-head);font-size:15px;font-weight:700;letter-spacing:.02em;padding:6px 8px}
.sched td.wkstart,.sched th.wkstart{border-left:2px solid var(--line-strong)}
.chip{display:block;width:100%;text-align:left;border-radius:4px;padding:3px 6px;margin:0 0 3px;cursor:pointer;border:1px solid transparent;background:var(--surface-2);font-size:12.5px;line-height:1.25}
.chip:hover{border-color:var(--ink)}
.chip .t{display:block;font-family:var(--font-mono);font-size:11px;color:var(--muted)}
.chip.ordinary{background:var(--surface-2);border-color:var(--line)}
.chip.reassigned,.chip.extra{background:var(--info-soft);color:var(--info)}
.chip.vacant{background:var(--err-soft);color:var(--err);border:1px dashed var(--err);font-weight:700}
.chip.open{background:var(--accent-soft);color:var(--accent-ink);border:1px dashed var(--warn);font-weight:700}
.chip.cancelled{background:transparent;color:var(--muted);text-decoration:line-through;border:1px dashed var(--line)}
.chip .flag{float:right;font-weight:700;font-size:11px;padding:0 4px;border-radius:3px;margin-left:4px}
.chip .flag.err{background:var(--err);color:#fff} .chip .flag.warn{background:var(--warn);color:#fff}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--muted);margin:10px 0 0}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{display:inline-block;width:14px;height:10px;border-radius:2px}

/* Listor */
.list{display:grid}
.item{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .main-t{min-width:0;flex:1 1 260px}
.item .main-t b{font-weight:700}
.item .meta{color:var(--muted);font-size:13px}
.issue{display:flex;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);align-items:flex-start}
.issue:last-child{border-bottom:0}
.issue .msg{flex:1;min-width:0}
.issues-box{display:grid;gap:6px;margin:8px 0}
.issues-box .row{padding:7px 10px;border-radius:var(--radius);font-size:13.5px}
.issues-box .row.err{background:var(--err-soft);color:var(--err)}
.issues-box .row.warn{background:var(--warn-soft);color:var(--warn)}
.issues-box .row.ok{background:var(--ok-soft);color:var(--ok)}
.empty{padding:26px 14px;text-align:center;color:var(--muted)}

/* Formulär */
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px 14px}
.field{display:grid;gap:4px;min-width:0}
.field.full{grid-column:1/-1}
.field label,.lbl{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.field input,.field select,.field textarea,.inp{border:1px solid var(--line-strong);background:var(--surface);border-radius:var(--radius);padding:7px 9px;width:100%;min-width:0}
.field .hint{font-size:12.5px;color:var(--muted)}
.checks{display:flex;flex-wrap:wrap;gap:6px 14px}
.checks label{display:inline-flex;gap:6px;align-items:center;text-transform:none;letter-spacing:0;font-size:14px;color:var(--ink);font-weight:400}
.matrix{border-collapse:collapse;font-size:13px}
.matrix th,.matrix td{padding:4px 6px;text-align:center;border-bottom:1px solid var(--line)}
.matrix th:first-child,.matrix td:first-child{text-align:left;white-space:nowrap}
.matrix input{width:18px;height:18px}
.presets{display:flex;flex-wrap:wrap;gap:6px}
.note{font-size:13px;color:var(--muted);background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius);padding:9px 11px}
.inline-confirm{background:var(--err-soft);border:1px solid var(--err);border-radius:var(--radius);padding:10px 12px;display:grid;gap:8px}

/* Modal */
#modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
#modal .scrim{position:absolute;inset:0;background:rgba(8,14,22,.55)}
#modal .dialog{position:relative;background:var(--surface);border-radius:8px;box-shadow:var(--shadow);width:min(760px,100%);max-height:calc(100vh - 24px);overflow:auto;border:1px solid var(--line)}
#modal .dialog.wide{width:min(980px,100%)}
.dlg-h{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding:16px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:1}
.dlg-b{padding:16px 18px;display:grid;gap:16px}
.dlg-f{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line)}
.sect{display:grid;gap:8px}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0}

#toast{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:9px 16px;border-radius:var(--radius);font-weight:600;z-index:60;box-shadow:var(--shadow);max-width:calc(100% - 32px)}

@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:static;height:auto;flex-direction:column;gap:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px}
  .nav{flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:4px}
  .nav button{white-space:nowrap;padding:6px 10px}
  .nav button[aria-current="page"]{box-shadow:inset 0 -3px 0 var(--accent)}
  .side-foot{display:none}
  .main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  h1{font-size:24px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="app" id="app"></div>
<div id="modal" hidden><div class="scrim" data-act="closeModal"></div><div class="dialog" id="dialog" role="dialog" aria-modal="true"></div></div>
<div id="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
'use strict';
/* =========================================================
   Konstanter & hjälpfunktioner
   ========================================================= */
const WD = ['Mån','Tis','Ons','Tor','Fre','Lör','Sön'];
const WD_LONG = ['måndag','tisdag','onsdag','torsdag','fredag','lördag','söndag'];
const MONTHS = ['januari','februari','mars','april','maj','juni','juli','augusti','september','oktober','november','december'];
const STORE_KEY = 'vaktplan.data.v1'; // samma nyckel, data uppgraderas via migrate()
const UI_KEY = 'vaktplan.ui.v1';

/* Bevakningsavtalet (Kollektivavtal Säkerhetsföretag) § 1 mom 1–4 */
const FORMS = {
  tv:   {name:'Tillsvidareanställning', needsEnd:false},
  prov: {name:'Provanställning', needsEnd:true, maxMonths:6},
  viss: {name:'Anställning för viss tid', needsEnd:true},
};
const TYPES = {
  heltid: {name:'Heltid', pay:'month', hint:'Månadslön. Arbetstidsmått 165,6 h/mån (150,67 vid kontinuerligt treskift).'},
  halvtid:{name:'Halvtid', pay:'hour', hint:'Timlön. Arbetstidsmått minst 82,8 h/mån (75,34 vid treskift) men under heltid.'},
  deltid: {name:'Deltid', pay:'hour', hint:'Timlön. Arbetstidsmått under 82,8 h/mån (75,34 vid treskift).'},
  behov:  {name:'Behovsanställning', pay:'hour', hint:'Inget arbetstidsmått, timlön per arbetad timme. Ska efter 9 månaders regelbundet arbete erbjudas annan anställningstyp.'},
};
/* § 3 mom 1: lönegrupper och ingruppering */
const LG = [
  {id:'N', name:'Nyanställningslön', desc:'De första sex månaderna av anställningen.'},
  {id:'G', name:'Grundlön', desc:'Efter sex månaders anställning.'},
  {id:'B', name:'Lönegrupp B', desc:'Port-/stationär-/receptionsbevakning med rondering, rond-/distrikts-/områdesbevakning, butiks- och köpcenterbevakning, hamn- och flygplatskontroll m.m.'},
  {id:'C', name:'Lönegrupp C', desc:'Ordningsvakt, skyddsvakt, jourdistriktsväktare, resursväktare, värdetransportör, operatör i larmcentral m.m.'},
  {id:'D', name:'Lönegrupp D', desc:'Operatör i speciella larmcentraler, gruppledare, teknisk utryckningsväktare m.m.'},
  {id:'E', name:'Lönegrupp E', desc:'Kvalificerad gruppledare, personskydd.'},
];
const LG_RANK = {N:0, G:1, B:2, C:3, D:4, E:5};
const CERTS = {vaktare:'Väktare', skyddsvakt:'Skyddsvakt', ordningsvakt:'Ordningsvakt'};
const ABS = {sjuk:'Sjuk', semester:'Semester', tjl:'Tjänstledig', vab:'VAB / föräldraledig', utb:'Utbildning', ovrigt:'Övrigt / omplanerat'};
/* § 3 mom 2: ob-tillägg, högsta tillämpliga kategori gäller */
const OBCATS = {
  kvallnatt:'Kväll och natt 18–06',
  helgdag:'Lör-, sön- och helgdag 06–18',
  helgnatt:'Helgnatt 18–06',
  storhelg:'Storhelg',
  afton:'Jul-, nyårs- och midsommarafton',
};

const pad = n => String(n).padStart(2,'0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseISO = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (d,n) => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate()+n); return x; };
const wdIdx = d => (d.getDay()+6)%7;
const mondayOf = d => addDays(d, -wdIdx(d));
const dayDiff = (a,b) => Math.round((parseISO(iso(b)) - parseISO(iso(a))) / 864e5);
const tmin = t => { const [h,m] = String(t).split(':').map(Number); return (h||0)*60 + (m||0); };
const at = (ds, t) => { const d = parseISO(ds); d.setHours(0, tmin(t), 0, 0); return d; };
const today0 = () => parseISO(iso(new Date()));
function isoWeek(d){ const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); const day = t.getUTCDay()||7; t.setUTCDate(t.getUTCDate()+4-day); const y0 = new Date(Date.UTC(t.getUTCFullYear(),0,1)); return Math.ceil(((t-y0)/864e5+1)/7); }
const fmtD = d => `${d.getDate()}/${d.getMonth()+1}`;
const fmtT = d => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
const fmtLong = d => `${WD_LONG[wdIdx(d)]} ${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`;
const kr = n => (Math.round(n*100)/100).toLocaleString('sv-SE',{minimumFractionDigits:2, maximumFractionDigits:2}) + ' kr';
const num = (n,dec=2) => (Math.round(n*100)/100).toLocaleString('sv-SE',{minimumFractionDigits:0, maximumFractionDigits:dec});
const hrs = n => num(n,2);

/* Svenska helgdagar */
function easter(y){ const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1; return new Date(y,mo-1,da); }
const holCache = {};
function holidays(y){
  if (holCache[y]) return holCache[y];
  const e = easter(y), H = {};
  // helgdag = allmän helgdag enligt lag; aftnar visas men räknas inte som helgdag
  const add = (d,name,hd) => H[iso(d)] = {name, helgdag:!!hd};
  let mids = null;
  add(new Date(y,0,1),'Nyårsdagen',1); add(new Date(y,0,6),'Trettondedag jul',1);
  add(addDays(e,-2),'Långfredagen',1); add(addDays(e,-1),'Påskafton',0); add(e,'Påskdagen',1); add(addDays(e,1),'Annandag påsk',1);
  add(new Date(y,4,1),'Första maj',1); add(addDays(e,39),'Kristi himmelsfärdsdag',1); add(addDays(e,48),'Pingstafton',0); add(addDays(e,49),'Pingstdagen',1); add(new Date(y,5,6),'Nationaldagen',1);
  for (let d=19; d<=25; d++){ const x = new Date(y,5,d); if (x.getDay()===5){ mids = x; add(x,'Midsommarafton',0); add(addDays(x,1),'Midsommardagen',1); } }
  for (let d=31; d<=37; d++){ const x = new Date(y,9,d); if (x.getDay()===6) add(x,'Alla helgons dag',1); }
  add(new Date(y,11,24),'Julafton',0); add(new Date(y,11,25),'Juldagen',1); add(new Date(y,11,26),'Annandag jul',1); add(new Date(y,11,31),'Nyårsafton',0);
  // Storhelgsperioder enligt § 3 mom 2 c) och d), [start, slut, kategori]
  const T = (d,h) => { const x = new Date(d); x.setHours(h,0,0,0); return x.getTime(); };
  const P = [];
  P.push([T(new Date(y,0,1),6), T(new Date(y,0,2),6), 'storhelg']);
  P.push([T(addDays(e,-3),18), T(addDays(e,2),6), 'storhelg']);
  P.push([T(addDays(e,48),6), T(addDays(e,50),6), 'storhelg']);
  if (mids){ P.push([T(addDays(mids,1),6), T(addDays(mids,2),6), 'storhelg']); P.push([T(mids,6), T(addDays(mids,1),6), 'afton']); }
  P.push([T(new Date(y,5,6),6), T(new Date(y,5,7),6), 'storhelg']);
  P.push([T(new Date(y,11,25),6), T(new Date(y,11,27),6), 'storhelg']);
  P.push([T(new Date(y,11,24),6), T(new Date(y,11,25),6), 'afton']);
  P.push([T(new Date(y,11,31),6), T(new Date(y+1,0,1),6), 'afton']);
  Object.defineProperty(H, '_periods', {value:P, enumerable:false});
  return holCache[y] = H;
}
const holiday = d => holidays(d.getFullYear())[iso(d)];
const isHelgdag = d => { const h = holiday(d); return !!(h && h.helgdag); };
function storhelgCat(t){
  const y = new Date(t).getFullYear(); let best = null;
  for (const yy of [y-1, y]) for (const [a,b,c] of holidays(yy)._periods) if (t >= a && t < b){ if (c==='afton') return 'afton'; best = c; }
  return best;
}

  const s = store(); let raw = null;
  try { raw = s && s.getItem(STORE_KEY); } catch(e){}
  if (raw){ try { D = JSON.parse(raw); } catch(e){ D = null; } }

  try { const u = s && JSON.parse(s.getItem(UI_KEY)||'null'); if (u) Object.assign(UI, u); } catch(e){}

/* Uppgradering av data från version 1 (exempelvärden) till avtalsmodellen */
function migrate(x){
  const lgMap = {G1:'N', G2:'G', G3:'B', G4:'C', G5:'E'};
  for (const e of x.employees){
    if (e.typ) continue;
    const oldForm = e.form, grad = e.grad||0;
    e.form = oldForm==='prov' ? 'prov' : (['sv','vikariat','sasong'].includes(oldForm) ? 'viss' : 'tv');
    if (oldForm==='behov') { e.typ = 'behov'; e.matt = 0; }
    else if (grad >= 100) { e.typ = 'heltid'; e.matt = 0; }
    else { const m = r2(165.6*grad/100); e.typ = m >= 82.8 ? 'halvtid' : 'deltid'; e.matt = m; }
    e.treskift = false; e.lg = lgMap[e.lg] || (LG.some(g=>g.id===e.lg) ? e.lg : 'G'); delete e.grad;
  }
  for (const r of [...x.series, ...(x.singles||[])]){ if (!('lg' in r)) r.lg = ''; if (!('mealPaid' in r)) r.mealPaid = false; if (!('dog' in r)) r.dog = false; }
  x.settings = defaultSettings(); x.version = 2;
}

/* Arbetstidsmått per månad enligt § 2 mom 1 (och bilaga 4 för nattarbetande) */
function baseMatt(e){ const S = D.settings; if (e.typ==='heltid') return e.treskift ? S.treskiftMatt : S.heltidMatt; if (e.typ==='behov') return 0; return +e.matt||0; }
function nightMatt(e){ const S = D.settings; return r2(baseMatt(e) * S.nattMatt / S.heltidMatt); }
function empType(e){ return TYPES[e.typ]?.name + (e.typ==='halvtid'||e.typ==='deltid' ? ` ${num(e.matt)} h/mån` : '') + (e.treskift ? ', treskift' : ''); }
function empLabel(e){ return `${FORMS[e.form]?.name||''}, ${(TYPES[e.typ]?.name||'').toLowerCase()}${e.typ==='halvtid'||e.typ==='deltid' ? ' '+num(e.matt)+' h/mån' : ''}`; }
function monthsBetween(a, b){ return (b.getFullYear()-a.getFullYear())*12 + (b.getMonth()-a.getMonth()) - (b.getDate() < a.getDate() ? 1 : 0); }
/* Påminnelser enligt § 1 mom 4 och § 3 mom 1 definitioner */
function empFlags(e){
  const t0 = today0(), out = [];
  if (e.start){
    const m = monthsBetween(parseISO(e.start), t0);
    if (e.lg==='N' && m >= 6) out.push(['warn', m >= 15 ? 'Ska ingrupperas i B–E (15 mån)' : 'Ska ha grundlön (6 mån)']);
    else if (e.lg==='G' && m >= 15) out.push(['warn','Ska ingrupperas i B–E (15 mån)']);
    if (e.typ==='behov' && m >= 9) out.push(['info','9 mån behov: erbjud annan anställningstyp']);
    if (e.form==='prov'){ const s = parseISO(e.start); const max = addDays(new Date(s.getFullYear(), s.getMonth()+6, s.getDate()), -1); const left = dayDiff(t0, max); if (left >= 0 && left <= 30) out.push(['warn',`Provanställning löper ut ${iso(max)}`]); }
  }
  if (FORMS[e.form]?.needsEnd && !e.end) out.push(['err','Slutdatum saknas']);
  else if (e.end){ const left = dayDiff(t0, parseISO(e.end)); if (left >= 0 && left <= 30) out.push(['warn','Slutar snart']); }
  return out;
}
const tariffLabel = ds => { const d = parseISO(ds); return `${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`; };
function tariffFor(ds){ const list = [...D.settings.tariffs].sort((a,b)=>a.from.localeCompare(b.from)); let t = list[0]; for (const x of list) if (x.from <= ds) t = x; return t; }
const firstName = id => { const e = empById(id); return e ? e.name.split(' ')[0] : '?'; };
const empName = id => { const e = empById(id); return e ? e.name : '–'; };

function seriesOccursOn(s, d){
  const ds = iso(d);
  if (!s.start || ds < s.start) return false;
  if (s.end && ds > s.end) return false;
  if (s.skipHol && isHelgdag(d)) return false;
  const anchor = mondayOf(parseISO(s.start));
  const w = Math.floor(dayDiff(anchor, d) / 7);
  const cyc = Math.max(1, s.cycle|0);
  const idx = ((w % cyc) + cyc) % cyc;
  return (s.days[idx] || []).includes(wdIdx(d));
}
function shiftTimes(ds, from, to){ const start = at(ds, from); let end = at(ds, to); if (end <= start) end = at(iso(addDays(parseISO(ds),1)), to); return {start, end}; }

function occurrences(from, to){
  const out = [];
  for (let d = new Date(from); d <= to; d = addDays(d,1)){
    const ds = iso(d);
    for (const s of D.series){
      if (!seriesOccursOn(s, d)) continue;
      const id = s.id + '@' + ds;
      const o = D.overrides[id] || {};
      const {start, end} = shiftTimes(ds, s.from, s.to);
      let status, personId;
      if (o.cancelled){ status = 'cancelled'; personId = null; }
      else if ('personId' in o){
        personId = o.personId;
        if (!personId) status = o.open ? 'open' : 'vacant';
        else status = personId === s.personId ? 'ordinary' : 'reassigned';
      } else { personId = s.personId || null; status = personId ? 'ordinary' : (o.open ? 'open' : 'vacant'); }
      if (personId && !empById(personId)){ personId = null; status = 'vacant'; }
      out.push({id, kind:'series', seriesId:s.id, date:ds, start, end, siteId:s.siteId, name:s.name, ordinaryId:s.personId||null,
        personId, status, absence:o.absence||null, overridden: !!D.overrides[id], breakMin:s.breakMin||0, requires:s.requires||'', lg:s.lg||'', mealPaid:!!s.mealPaid, dog:!!s.dog});
    }
  }
  const f = iso(from), t = iso(to);
  for (const x of D.singles){
    if (x.date < f || x.date > t) continue;
    const {start, end} = shiftTimes(x.date, x.from, x.to);
    let personId = x.personId && empById(x.personId) ? x.personId : null;
    const status = x.cancelled ? 'cancelled' : personId ? 'extra' : (x.open ? 'open' : 'vacant');
    if (x.cancelled) personId = null;
    out.push({id:'x:'+x.id, kind:'single', singleId:x.id, date:x.date, start, end, siteId:x.siteId, name:x.name, ordinaryId:null,
      personId, status, absence:null, overridden:false, breakMin:x.breakMin||0, requires:x.requires||'', lg:x.lg||'', mealPaid:!!x.mealPaid, dog:!!x.dog});
  }
  out.sort((a,b) => a.start - b.start || a.name.localeCompare(b.name));
  return out;
}
function getOcc(id){
  let ds;
  if (id.startsWith('x:')){ const x = D.singles.find(s => 'x:'+s.id===id); if (!x) return null; ds = x.date; }
  else ds = id.split('@')[1];
  const d = parseISO(ds);
  return occurrences(d, d).find(o => o.id===id) || null;
}
const hoursOf = o => Math.max(0, (o.end - o.start)/36e5 - (o.breakMin||0)/60);
const grossH = o => (o.end - o.start)/36e5;
const occLabel = o => `${o.name} ${fmtD(o.start)} ${fmtT(o.start)}–${fmtT(o.end)}`;
const STATUS = {ordinary:['Ordinarie',''], reassigned:['Omfördelat','info'], extra:['Extrapass','info'], vacant:['Vakant','err'], open:['Fritt att boka','amber'], cancelled:['Inställt','']};

/* Ändringar av pass */
function setOcc(occ, patch){
  if (occ.kind === 'single'){
    const x = D.singles.find(s => s.id===occ.singleId);
    if ('personId' in patch) x.personId = patch.personId;
    if ('open' in patch) x.open = patch.open;
    if ('cancelled' in patch) x.cancelled = patch.cancelled;
  } else {
    const s = seriesById(occ.seriesId);
    const o = Object.assign({}, D.overrides[occ.id] || {}, patch);
    if (!o.cancelled && 'personId' in o && o.personId && o.personId === s.personId && !o.open){ delete D.overrides[occ.id]; }
    else D.overrides[occ.id] = o;
  }
  save();
}

/* =========================================================
   Regelkontroll (ATL + avtal)
   ========================================================= */
function maxFree(intervals, ws, we){
  let best = 0, cur = ws;
  for (const [a,b] of intervals){ const st = Math.max(a, ws); if (st > cur) best = Math.max(best, st - cur); cur = Math.max(cur, Math.min(b, we)); }
  return Math.max(best, we - cur);
}
function checkPerson(emp, shifts){
  const R = D.settings.rules; const issues = [];
  const add = (level, rule, msg, ids, key) => issues.push({level, rule, msg, shifts:ids, key: key || (rule+':'+ids.join(',')), personId: emp.id});
  for (let i=0;i<shifts.length;i++){
    const s = shifts[i], len = grossH(s);
    if (len > R.maxShiftOverlap) add('error','Passlängd',`Passet är ${hrs(len)} h. Max ${R.maxShift} h, eller ${R.maxShiftOverlap} h vid dygnet runt-bevakning med överlappning (§ 2 mom 4). Tid över 13 h per pass är övertid (§ 4 mom 3).`,[s.id]);
    else if (len > R.maxShift) add('warn','Passlängd',`Passet är ${hrs(len)} h. Över ${R.maxShift} h kräver lokal överenskommelse eller överlappning vid dygnet runt-bevakning (§ 2 mom 4).`,[s.id]);
    if (len > R.mealAfter && !s.mealPaid && (s.breakMin||0) < R.minMeal) add('warn','Rast',`Pass över ${R.mealAfter} h ska ha måltidsrast om minst ${R.minMeal} min, högst 1 h, eller betalt måltidsuppehåll på arbetsplatsen (§ 2 mom 5).`,[s.id]);
    else if ((s.breakMin||0) > 90) add('warn','Rast',`Måltidsrasten är ${s.breakMin} min. Högst 1 h, eller 1,5 h efter lokal överenskommelse (§ 2 mom 5).`,[s.id]);
    if (i>0){
      const p = shifts[i-1];
      if (p.end > s.start) add('error','Dubbelbokning',`Överlappar ${occLabel(p)}.`,[p.id, s.id]);
      else { const gap = (s.start - p.end)/36e5; if (gap < R.minRest - 1e-9) add('error','Dygnsvila',`${hrs(gap)} h mellan ${occLabel(p)} och ${occLabel(s)}. Uppehållet mellan passen ska vara minst ${R.minRest} h (§ 2 mom 3, ATL 13 §).`,[p.id, s.id],'dygn:'+p.id+','+s.id); }
    }
    if ((emp.start && s.date < emp.start) || (emp.end && s.date > emp.end)) add('error','Anställning',`Passet ligger utanför anställningsperioden (${emp.start||'…'} – ${emp.end||'tills vidare'}).`,[s.id]);
    if (s.requires && !(emp.certs||[]).includes(s.requires)) add('warn','Behörighet',`Passet kräver behörighet som ${CERTS[s.requires]||s.requires}.`,[s.id]);
  }
  // Veckovila (§ 2 mom 2), veckoarbetstid (§ 2 mom 4), sammanlagd arbetstid och nattarbete (bilaga 3)
  const weeks = new Map(), weekHours = new Map(), weekNight = new Map();
  for (const s of shifts){ for (const k of new Set([iso(mondayOf(s.start)), iso(mondayOf(new Date(s.end.getTime()-1)))])){ if (!weeks.has(k)) weeks.set(k, []); weeks.get(k).push(s); } }
  for (const s of shifts){ const k = iso(mondayOf(s.start)); weekHours.set(k, (weekHours.get(k)||0) + hoursOf(s)); const nw = weekNight.get(k) || [0,0]; nw[0]++; if (obSplit(s).natt22 >= 180) nw[1]++; weekNight.set(k, nw); }
  const n = Math.max(1, R.avgWeeks|0);
  for (const [k, list] of weeks){
    const wk = isoWeek(parseISO(k));
    const ws = parseISO(k).getTime(), we = addDays(parseISO(k),7).getTime();
    const free = maxFree(list.map(s => [s.start.getTime(), s.end.getTime()]).sort((a,b)=>a[0]-b[0]), ws, we) / 36e5;
    if (free < R.minWeeklyRestAbs - 1e-9) add('error','Veckovila',`Vecka ${wk}: längsta sammanhängande ledighet är ${hrs(free)} h. Vid schemaläggning får veckovilan aldrig understiga ${R.minWeeklyRestAbs} h per 7-dygnsperiod (§ 2 mom 2).`, list.map(s=>s.id), 'vecka:'+emp.id+':'+k);
    else if (free < R.minWeeklyRest - 1e-9) add('warn','Veckovila',`Vecka ${wk}: längsta sammanhängande ledighet är ${hrs(free)} h. Veckovilan ska vara minst ${R.minWeeklyRest} h; avsteg bara när schemat kräver det (§ 2 mom 2).`, list.map(s=>s.id), 'vecka:'+emp.id+':'+k);
    const own = list.filter(s=>iso(mondayOf(s.start))===k).map(s=>s.id);
    const wh = weekHours.get(k)||0;
    if (wh > R.maxWeek + 1e-9) add('error','Veckoarbetstid',`Vecka ${wk}: ${hrs(wh)} h. Arbetstiden får inte överstiga ${R.maxWeek} h per vecka (§ 2 mom 4).`, own, 'vtid:'+emp.id+':'+k);
    if (!wh) continue;
    let sum = 0, cnt = 0, nights = 0;
    for (let w=0; w<n; w++){ const kk = iso(addDays(parseISO(k), -7*w)); sum += weekHours.get(kk) || 0; const nw = weekNight.get(kk); if (nw){ cnt += nw[0]; nights += nw[1]; } }
    if (sum/n > R.maxAvgWeek + 1e-9) add('warn','Arbetstid',`I snitt ${hrs(sum/n)} h/vecka under ${n} veckor fram till v.${wk}. Den sammanlagda arbetstiden får inte överstiga ${R.maxAvgWeek} h/vecka i snitt under 4 månader (bilaga 3, ATL 10 b §).`, own, 'snitt:'+emp.id+':'+k);
    if (cnt && nights/cnt >= 0.5){ const per24 = sum / (6*n); if (per24 > R.maxNightAvg + 1e-9) add('warn','Nattarbete',`Nattarbetande: i snitt ${hrs(per24)} h per 24 h under ${n} veckor fram till v.${wk}. Max ${R.maxNightAvg} h i snitt (bilaga 3, 2 §).`, own, 'natt:'+emp.id+':'+k); }
  }
  // Allmän övertid (bilaga 3, 3 §): extra pass för heltidsanställda
  if (isHeltid(emp)){
    const months = new Map();
    for (const s of shifts){ if (s.kind==='single' || s.ordinaryId !== emp.id){ const k = s.date.slice(0,7); if (!months.has(k)) months.set(k, []); months.get(k).push(s); } }
    for (const [k, list] of months){ const h = list.reduce((a,s)=>a+hoursOf(s),0); if (h > R.maxOtMonth) add('warn','Övertid',`${hrs(h)} h utöver schema i ${MONTHS[+k.slice(5)-1]}. Allmän övertid högst ${R.maxOtMonth} h per kalendermånad och ${R.maxOtYear} h per år (bilaga 3, 3 §).`, list.map(s=>s.id), 'ot:'+emp.id+':'+k); }
  }
  const seen = new Set();
  return issues.filter(i => seen.has(i.key) ? false : (seen.add(i.key), true));
}
const poolDays = () => Math.max(35, (D.settings.rules.avgWeeks|0)*7);
const memo = new Map();
function analyze(from, to){
  const key = VER+'|'+iso(from)+'|'+iso(to);
  if (memo.has(key)) return memo.get(key);
  const occs = occurrences(addDays(from,-poolDays()), addDays(to,35));
  const byOcc = new Map(), list = [], f = iso(from), t = iso(to), byId = new Map(occs.map(o=>[o.id,o]));
  for (const emp of D.employees){
    const shifts = occs.filter(o => o.personId===emp.id && o.status!=='cancelled');
    if (!shifts.length) continue;
    for (const is of checkPerson(emp, shifts)){
      for (const id of is.shifts){ if (!byOcc.has(id)) byOcc.set(id, []); byOcc.get(id).push(is); }
      if (is.shifts.some(id => { const o = byId.get(id); return o && o.date >= f && o.date <= t; })) list.push(is);
    }
  }
  const inRange = occs.filter(o => o.date >= f && o.date <= t);
  const res = {occs: inRange, all: occs, byOcc, list, byId};
  if (memo.size > 30) memo.clear();
  memo.set(key, res);
  return res;
}
function simulate(occ, pid, pool){
  const emp = empById(pid); if (!emp) return [];
  const occs = pool || occurrences(addDays(occ.start,-poolDays()), addDays(occ.start,35));
  const shifts = occs.filter(o => o.personId===pid && o.status!=='cancelled' && o.id!==occ.id);
  shifts.push(Object.assign({}, occ, {personId:pid, status: occ.kind==='single' ? 'extra' : (pid===occ.ordinaryId ? 'ordinary':'reassigned')}));
  shifts.sort((a,b)=>a.start-b.start);
  return checkPerson(emp, shifts).filter(i => i.shifts.includes(occ.id));
}
const worst = list => list.some(i=>i.level==='error') ? 'error' : list.length ? 'warn' : null;

/* =========================================================
   Lön enligt Bevakningsavtalet
   ========================================================= */
/* OB-kategori för en minut (§ 3 mom 2). Högsta tillämpliga belopp gäller: d > c > b1 > b > a. */
function obCat(t, shiftStart){
  const sc = storhelgCat(t); if (sc) return sc;
  const d = new Date(t), hr = d.getHours(), day = parseISO(iso(d));
  if (hr >= 18 || hr < 6){
    const E = hr >= 18 ? day : addDays(day, -1), M = addDays(E, 1);
    if ([5,6,0].includes(wdIdx(M)) || isHelgdag(M) || isHelgdag(E)) return 'helgnatt';
    return 'kvallnatt';
  }
  if (wdIdx(d) >= 5 || isHelgdag(d)) return 'helgdag';
  // Anm. fr.o.m. 2015-01-01: natt mot helgfri vardag ger ob till passets slut, längst till kl 08
  if (hr < 8 && shiftStart < day.getTime() && iso(d) >= '2015-01-01') return 'kvallnatt';
  return null;
}
const splitCache = new Map();
function obSplit(o){
  const key = o.start.getTime()+'-'+o.end.getTime();
  if (splitCache.has(key)) return splitCache.get(key);
  const r = {kvallnatt:0, helgdag:0, helgnatt:0, storhelg:0, afton:0, natt22:0, total:0};
  const st = o.start.getTime();
  for (let t = st; t < o.end.getTime(); t += 6e4){ const c = obCat(t, st); if (c) r[c]++; const h = new Date(t).getHours(); if (h >= 22 || h < 6) r.natt22++; r.total++; }
  splitCache.set(key, r); return r;
}
function monthRange(ym){ const [y,m] = ym.split('-').map(Number); return [new Date(y,m-1,1), new Date(y,m,0)]; }
const payMemo = new Map();
function payCtx(ym){
  const key = VER+'|'+ym; if (payMemo.has(key)) return payMemo.get(key);
  const [y,m] = ym.split('-').map(Number); const q0 = Math.floor((m-1)/3)*3;
  const occsQ = occurrences(new Date(y,q0,1), new Date(y,q0+3,0));
  const ctx = {ym, occsQ, months:[0,1,2].map(i=>`${y}-${pad(q0+i+1)}`), qEnd: m===q0+3, occsMonth: occsQ.filter(o=>o.date.slice(0,7)===ym)};
  if (payMemo.size > 24) payMemo.clear(); payMemo.set(key, ctx); return ctx;
}
function monthStats(emp, occs){
  const S = D.settings;
  const worked = occs.filter(o => o.personId===emp.id && o.status!=='cancelled');
  const absent = occs.filter(o => o.kind==='series' && o.ordinaryId===emp.id && ['vacant','open','reassigned'].includes(o.status));
  const own = occs.filter(o => o.kind==='series' && o.ordinaryId===emp.id && o.status!=='cancelled');
  let ordH = 0, extraH = 0;
  for (const o of worked){ const h = hoursOf(o); if (o.kind==='series' && o.ordinaryId===emp.id) ordH += h; else extraH += h; }
  const absH = {}; for (const o of absent){ const r = o.absence || 'ovrigt'; absH[r] = (absH[r]||0) + hoursOf(o); }
  // Nattarbetande enligt bilaga 4: mer än 50 % av schemalagda timmar mellan 22 och 06
  let nm = 0, tm = 0; for (const o of (emp.typ==='behov' ? worked : own)){ const sp = obSplit(o); nm += sp.natt22; tm += sp.total; }
  const natt = emp.typ!=='behov' && tm > 0 && nm/tm*100 > S.nattAndel;
  const base = baseMatt(emp), matt = natt ? nightMatt(emp) : base;
  const counted = ordH + extraH + (absH.sjuk||0) + (absH.semester||0) + (absH.utb||0) + (absH.ovrigt||0);
  return {worked, absent, ordH, extraH, absH, natt, base, matt, atf: r2(base - matt), counted};
}
/* § 4 mom 3: övertid = tid över 165,6 h/mån (eller reducerat mått) i genomsnitt under kalenderkvartalet */
function quarterOT(emp, ctx){
  let counted = 0, matt = 0, extra = 0;
  for (const m of ctx.months){ if (m > ctx.ym) break; const st = monthStats(emp, ctx.occsQ.filter(o=>o.date.slice(0,7)===m)); counted += st.counted; matt += st.matt; extra += st.extraH; }
  return {counted, matt, extra, otH: Math.max(0, counted - matt)};
}
function calcPay(emp, ym, ctx){
  ctx = ctx || payCtx(ym);
  const S = D.settings, [a] = monthRange(ym), T = tariffFor(iso(a));
  const lg = lgOf(emp), mlon = T.salary[emp.lg] || 0, tim = T.hourly[emp.lg] || 0;
  const monthly = isHeltid(emp);
  const st = monthStats(emp, ctx.occsMonth);
  const lines = [];
  const L = (text, qty, price, amount, kind) => lines.push({text, qty, price, amount: r2(amount ?? (qty*price)), kind: kind||'pay'});
  const ob = {kvallnatt:0, helgdag:0, helgnatt:0, storhelg:0, afton:0};
  const shiftRows = []; let lgAdd = 0, lgAddH = 0, dogH = 0;
  for (const o of st.worked){
    const h = hoursOf(o), sp = obSplit(o), f = sp.total ? h/sp.total : 0;
    let obh = 0; for (const c in ob){ ob[c] += sp[c]*f; obh += sp[c]*f; }
    const isOrd = o.kind==='series' && o.ordinaryId===emp.id;
    if (o.lg && LG_RANK[emp.lg] >= 2 && LG_RANK[o.lg] > LG_RANK[emp.lg]){ const diff = (T.hourly[o.lg]||0) - tim; if (diff > 0){ lgAdd += diff*h; lgAddH += h; } }
    if (o.dog) dogH += h;
    shiftRows.push({o, h, obh, type: !monthly ? 'Timlön' : isOrd ? 'Ordinarie' : 'Utöver schema'});
  }
  // Grundlön
  if (monthly) L(`Månadslön, ${lg?.name||emp.lg}`, null, null, mlon);
  else if (st.worked.length) L(`Timlön, ${lg?.name||emp.lg}`, st.ordH + st.extraH, tim);
  // Tillägg
  if (lgAddH) L('Tillägg pass i högre lönegrupp (§ 3 mom 1 prot. b)', lgAddH, null, lgAdd);
  for (const c in ob) if (ob[c] > 0.001) L('OB ' + OBCATS[c].toLowerCase(), ob[c], T.ob[c]);
  if (dogH) L('Tillägg bevakning med hund (§ 3 mom 2:2)', dogH, T.hund);
  // Förskjuten arbetstid och övertid (heltid, § 4)
  let q = null;
  if (monthly){
    if (st.extraH) L('Förskjuten arbetstid (§ 4 mom 5)', st.extraH, T.forskjuten);
    q = quarterOT(emp, ctx);
    if (ctx.qEnd && q.otH > 0.001){
      L(`Övertid, ${S.otPct} % timlön + månadslön/${num(st.matt)} (§ 4 mom 2–3)`, q.otH, tim*S.otPct/100 + mlon/st.matt);
      const back = Math.min(q.otH, q.extra); if (back > 0.001) L('Avgår förskjuten arbetstid som ersätts som övertid', back, -T.forskjuten);
    } else if (!ctx.qEnd) L(`Kvartalsavstämning hittills: ${num(q.counted)} h mot mått ${num(q.matt)} h (övertid regleras i kvartalets sista månad)`, null, null, 0, 'info');
  }
  // Frånvaro
  let sickBase = 0;
  for (const o of st.absent) if ((o.absence||'ovrigt')==='sjuk'){ const sp = obSplit(o), f = sp.total ? hoursOf(o)/sp.total : 0; sickBase += hoursOf(o)*tim; for (const c in ob) sickBase += sp[c]*f*T.ob[c]; }
  const A = st.absH;
  if (A.sjuk){
    if (monthly) L('Sjukavdrag, timavdrag (§ 5 mom 1)', A.sjuk, -tim);
    L(`Sjuklön ${S.sickPct} % inkl. förlorad OB (sjuklönelagen)`, A.sjuk, null, sickBase*S.sickPct/100, 'sick');
    const weekPay = monthly ? mlon*12/52 : tim*baseMatt(emp)*12/52;
    if (weekPay) L(`Karensavdrag ${S.karensPct} % av genomsnittlig veckosjuklön`, null, null, -(S.sickPct/100)*weekPay*S.karensPct/100, 'sick');
  }
  if (monthly){
    if (A.tjl) L('Avdrag tjänstledighet (§ 5 mom 1)', A.tjl, -tim);
    if (A.vab) L('Avdrag VAB / föräldraledighet (§ 5 mom 1)', A.vab, -tim);
    if (A.semester) L('Semester (semesterlön enligt § 11 beräknas inte här)', A.semester, 0, 0, 'info');
    for (const r of ['utb','ovrigt']) if (A[r]) L(`${ABS[r]}, ingen löneändring`, A[r], 0, 0, 'info');
  } else {
    for (const r of ['utb','ovrigt']) if (A[r]) L(`${ABS[r]}: ordinarie pass ersätts med timlön`, A[r], tim);
    for (const r of ['tjl','vab','semester']) if (A[r]) L(`${ABS[r]}: ingen timlön för ordinarie pass`, A[r], 0, 0, 'info');
  }
  // Arbetstidsförkortning för nattarbetande (bilaga 4)
  if (st.natt && st.atf > 0) L(`Arbetstidsförkortning nattarbetande: mått ${num(st.matt)} h i stället för ${num(st.base)} h (bilaga 4)`, st.atf, null, 0, 'info');
  // Semesterlön för timavlönade (§ 11 mom 6): 13 % av lönen exkl. sjuklön
  let semAcc = 0;
  if (!monthly){
    const base = lines.filter(l => l.kind==='pay' && l.amount > 0).reduce((s,l)=>s+l.amount,0);
    semAcc = r2(base*S.semPct/100);
    if (semAcc) L(S.semMode==='lopande' ? `Semesterlön ${S.semPct} % (§ 11 mom 6)` : `Semesterlön ${S.semPct} % intjänad, utbetalas i maj (§ 11 mom 6)`, null, null, semAcc, S.semMode==='lopande' ? 'pay' : 'accrual');
  }
  const brutto = r2(lines.filter(l => l.kind!=='info' && l.kind!=='accrual').reduce((s,l)=>s+l.amount,0));
  const obH = Object.values(ob).reduce((a,b)=>a+b,0), obKr = Object.keys(ob).reduce((s,c)=>s+ob[c]*T.ob[c],0);
  const absTot = Object.values(A).reduce((a,b)=>a+b,0);
  return {emp, lg, T, mlon, tim, monthly, hourly:!monthly, ord:st.ordH, extra:st.extraH, ob, obH, obKr, absH:A, absTot, atfH: st.natt ? st.atf : 0, natt:st.natt, matt:st.matt, q, lines, brutto, shiftRows, semAcc};
}

const DL = (window.claude && typeof window.claude.use === 'function') ? window.claude.use('downloads').catch(()=>null) : Promise.resolve(null);
async function offerFile(filename, blob){

    return;
  }
  const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url), 5000); toast(`${filename} skapad`);
}
function libsOk(kind){

function chipHtml(o, issues, mode){
  const lvl = worst(issues||[]);
  let label;
  if (o.status==='vacant') label = 'VAKANT'; else if (o.status==='open') label = 'Fritt pass'; else if (o.status==='cancelled') label = 'Inställt';
  else label = mode==='person' ? esc(o.name) : esc(firstName(o.personId));
  const sub = mode==='person' ? `${fmtT(o.start)}–${fmtT(o.end)} · ${esc(siteById(o.siteId)?.name||'')}` : `${fmtT(o.start)}–${fmtT(o.end)}`;
  const flag = lvl ? `<span class="flag ${lvl==='error'?'err':'warn'}" title="${esc((issues||[]).map(i=>i.rule+': '+i.msg).join('\n'))}">${lvl==='error'?'ATL':'!'}</span>` : '';
  return `<button class="chip ${o.status}" data-act="shift" data-id="${esc(o.id)}">${flag}${label}<span class="t">${sub}</span></button>`;
}
function issuesHtml(list, okText){
  if (!list.length) return okText ? `<div class="issues-box"><div class="row ok">${okText}</div></div>` : '';
  return `<div class="issues-box">${list.map(i => `<div class="row ${i.level==='error'?'err':'warn'}"><b>${i.level==='error'?'Bryter mot regel':'Varning'} · ${esc(i.rule)}:</b> ${esc(i.msg)}</div>`).join('')}</div>`;
}
function statusPill(o){ const [t,c] = STATUS[o.status]; return `<span class="pill ${c}">${t}</span>`; }
function patternText(s){
  const fmt = days => { const d = [...days].sort((a,b)=>a-b); const parts = []; let i = 0;
    while (i < d.length){ let j = i; while (j+1 < d.length && d[j+1]===d[j]+1) j++; parts.push(j>i ? `${WD[d[i]]}–${WD[d[j]]}` : WD[d[i]]); i = j+1; }
    return parts.join(', ') || 'ledigt'; };
  const c = Math.max(1, s.cycle|0);
  const hol = s.skipHol ? ', ledigt helgdagar' : '';
  if (c===1) return `${fmt(s.days[0]||[])} varje vecka${hol}`;
  const ord = {2:'varannan vecka',3:'var tredje vecka',4:'var fjärde vecka'}[c] || `var ${c}:e vecka`;
  return Array.from({length:c}, (_,i) => `V${i+1}: ${fmt(s.days[i]||[])}`).join(' · ') + ` (upprepas ${ord})${hol}`;
}
function seriesWeekHours(s){
  const c = Math.max(1,s.cycle|0); const {start,end} = shiftTimes('2026-01-05', s.from, s.to);
  const h = Math.max(0,(end-start)/36e5 - (s.breakMin||0)/60);
  let n = 0; for (let i=0;i<c;i++) n += (s.days[i]||[]).length; return h*n/c;
}

      if (singles.length) body += `<tr><th class="rowh"><b>Extrapass</b><span>enstaka pass</span></th>${days.map(d => `<td class="${cellCls(d)}">${singles.filter(o=>o.date===iso(d)).map(o=>chipHtml(o, A.byOcc.get(o.id))).join('')}</td>`).join('')}</tr>`;
    }
  } else {
    const unstaffed = A.occs.filter(o => !o.personId && o.status!=='cancelled');
    body += `<tr><th class="rowh"><b>Obemannat</b><span>vakanta och fria pass</span></th>${days.map(d => `<td class="${cellCls(d)}">${unstaffed.filter(o=>o.date===iso(d)).map(o=>chipHtml(o, null, 'person')).join('')}</td>`).join('')}</tr>`;
    for (const e of D.employees){
      const mine = A.occs.filter(o => o.personId===e.id);

      body += `<tr><th class="rowh"><b>${esc(e.name)}</b><span>${esc(empType(e))} · ${hrs(h)} h i perioden</span></th>${days.map(d => `<td class="${cellCls(d)}">${mine.filter(o=>o.date===iso(d)).map(o=>chipHtml(o, A.byOcc.get(o.id), 'person')).join('')}</td>`).join('')}</tr>`;
    }
  }
  return `
  <div class="page-head"><div><div class="eyebrow">Vecka ${isoWeek(from)}${weeks>1?'–'+isoWeek(to):''} · ${fmtD(from)} – ${fmtD(to)} ${to.getFullYear()}</div><h1>Schema</h1><p>Klicka på ett pass för att byta personal, göra det vakant eller lägga ut det som fritt att boka.</p></div>

  </div>
  <div class="panel tbl-wrap"><table class="sched"><thead>${head}</thead><tbody>${body || `<tr><td colspan="${days.length+1}" class="empty">Inga pass i perioden.</td></tr>`}</tbody></table></div>
  <div class="legend"><span><i style="background:var(--surface-2);border:1px solid var(--line)"></i>Ordinarie</span><span><i style="background:var(--info-soft)"></i>Omfördelat / extrapass</span><span><i style="background:var(--err-soft);border:1px dashed var(--err)"></i>Vakant</span><span><i style="background:var(--accent-soft);border:1px dashed var(--warn)"></i>Fritt att boka</span><span><b style="color:var(--err)">ATL</b> bryter mot arbetstidsregel</span><span><b style="color:var(--warn)">!</b> varning</span></div>`;
};

  const nf = (id, val, step, label, hint) => `<div class="field"><label for="${id}">${label}</label><input id="${id}" type="number" step="${step||'any'}" value="${val}" data-chg="setting" data-path="${id}">${hint?`<span class="hint">${hint}</span>`:''}</div>`;

      </tbody></table></div>

function parseDays(txt){
  const names = ['mån','tis','ons','tor','fre','lör','sön'];
  const re = /(mån|tis|ons|tor|fre|lör|sön)[a-zåäö]*(?:\s*[-–]\s*(mån|tis|ons|tor|fre|lör|sön)[a-zåäö]*)?/g;
  const out = new Set(); let m;
  while ((m = re.exec(txt))){ const a = names.indexOf(m[1]); const b = m[2] ? names.indexOf(m[2]) : a; let i = a; for (let k=0;k<7;k++){ out.add(i); if (i===b) break; i = (i+1)%7; } }
  return [...out].sort((a,b)=>a-b);
}
function parsePattern(txt){
  const t = txt.toLowerCase();
  const m = t.match(/(\d{1,2})(?:[:.](\d{2}))?\s*[-–]\s*(\d{1,2})(?:[:.](\d{2}))?/);
  if (!m) return null;
  const from = pad(+m[1]%24)+':'+(m[2]||'00'), to = pad(+m[3]%24)+':'+(m[4]||'00');
  const rest = t.replace(/\d{1,2}(?:[:.]\d{2})?\s*[-–]\s*\d{1,2}(?:[:.]\d{2})?/g,' ');
  let weeks = rest.split(/\||;|\bvecka\s*2\b|\bv2\b|\boch sedan\b/).map(parseDays).filter(w=>w.length);
  let cycle = weeks.length || 1;
  if (/varannan/.test(t) && cycle < 2) cycle = 2;
  if (/var tredje/.test(t) && cycle < 3) cycle = 3;
  if (/var fjärde/.test(t) && cycle < 4) cycle = 4;
  const days = Array.from({length:cycle}, (_,i)=>weeks[i]||[]);
  return {from, to, cycle, days};
}

function suggestLg(start, cur){
  if (!start) return null; const m = monthsBetween(parseISO(start), today0());
  if (m < 6) return {ids:['N'], text:'Under 6 månaders anställning: nyanställningslön.'};
  if (m < 15) return {ids:['G'], text:'6–15 månaders anställning: grundlön.'};
  return {ids:['B','C','D','E'], text:'Över 15 månaders anställning: ingrupperas i B–E efter arbetsuppgifter (§ 3 mom 1, bilaga 2).'};
}

  pickTariff: d => { UI.tariff = d.f; UI.confirm = null; render(); },
  addTariff: () => {
    const list = [...D.settings.tariffs].sort((a,b)=>a.from.localeCompare(b.from)); const last = list[list.length-1];
    let y = Math.max(+last.from.slice(0,4)+1, today0().getFullYear()); let from = `${y}-04-01`; while (D.settings.tariffs.some(t=>t.from===from)) from = `${++y}-04-01`;
    const t = JSON.parse(JSON.stringify(last)); t.from = from; t.label = tariffLabel(from); D.settings.tariffs.push(t); UI.tariff = from; save(); render(); toast('Ny avtalsperiod skapad som kopia av den senaste. Fyll i de nya beloppen.');
  },
  askDelTariff: () => { UI.confirm = 'delTariff'; render(); },
  delTariff: d => { D.settings.tariffs.splice(+d.i,1); UI.confirm = null; UI.tariff = null; save(); render(); toast('Avtalsperioden är borttagen'); },
  addSite: () => { D.sites.push({id:uid('s'), name:'Nytt objekt', address:''}); save(); render(); },
  delSite: d => { D.sites.splice(+d.i,1); save(); render(); },
  backup: () => offerFile(`vaktplan-backup-${iso(new Date())}.json`, new Blob([JSON.stringify(D,null,2)], {type:'application/json'})),
  askReset: () => { UI.confirm = 'reset'; render(); },
  doReset: () => { D = seed(); UI.confirm = null; UI.user = 'e1'; save(); render(); toast('Demodata återställd'); },
};
const CHG = {
  who: el => { UI.user = el.value; UI.view = null; UI.bookCheck = null; render(); },
  cand: el => { UI.selCand = el.value || null; UI.pendingForce = null; refreshModal(); },
  draft: () => { syncDraft(); refreshModal(); },
  draftDay: el => { syncDraft(); const w = +el.dataset.w, i = +el.dataset.d; const set = new Set(UI.draft.days[w]||[]); el.checked ? set.add(i) : set.delete(i); UI.draft.days[w] = [...set].sort((a,b)=>a-b); refreshModal(); },
  empDraft: () => { syncEmp(); refreshModal(); },
  payMonth: el => { if (el.value){ UI.payMonth = el.value; render(); } },
  myMonth: el => { if (el.value){ UI.myMonth = el.value; render(); } },
  setting: el => {
    const path = el.dataset.path.split('.'); let o = D.settings; for (let i=0;i<path.length-1;i++) o = o[path[i]];
    const k = path[path.length-1]; o[k] = el.type==='number' ? (+el.value||0) : el.value; save(); render();
  },
  tariff: el => { const t = D.settings.tariffs[+el.dataset.i]; const f = el.dataset.f, k = el.dataset.k, v = +el.value || 0; if (k) t[f][k] = v; else t[f] = v; save(); render(); },
  tariffFrom: el => { const t = D.settings.tariffs[+el.dataset.i]; if (!el.value) return; if (D.settings.tariffs.some(o=>o!==t && o.from===el.value)){ toast('Det finns redan en period med det datumet.'); return render(); } t.from = el.value; t.label = tariffLabel(el.value); UI.tariff = el.value; save(); render(); },
  site: el => { D.sites[+el.dataset.i][el.dataset.f] = el.value; save(); render(); },
  import: el => {
    const f = el.files && el.files[0]; if (!f) return; const r = new FileReader();
    r.onload = () => { try { const x = JSON.parse(r.result); if (!x.employees || !x.series || !x.settings) throw 0; x.singles = x.singles||[]; x.overrides = x.overrides||{}; x.sites = x.sites||[]; if ((x.version||1) < 2) migrate(x); D = x; save(); UI.user = D.employees.find(e=>e.role==='arbetsledare')?.id || D.employees[0].id; render(); toast('Säkerhetskopian är importerad'); } catch(e){ toast('Filen är ingen giltig säkerhetskopia från Vaktplan.'); } };
    r.readAsText(f);
  },
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  if (el.tagName==='TR' && e.target.closest('input,select,a')) return;
  const fn = ACT[el.dataset.act]; if (fn){ e.preventDefault(); fn(el.dataset, el, e); }
});
document.addEventListener('change', e => { const el = e.target.closest('[data-chg]'); if (el && CHG[el.dataset.chg]) CHG[el.dataset.chg](el, e); });
document.addEventListener('keydown', e => { if (e.key==='Escape' && !$('#modal').hidden) closeModal(); });

/* Start */
load();
if (!empById(UI.user)) UI.user = (D.employees.find(e=>e.role==='arbetsledare') || D.employees[0]).id;
UI.schedStart = mondayOf(today0());
UI.payMonth = iso(today0()).slice(0,7);
render();
</script>

<title>Vaktplan</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: mörk sidopanel som kontrollrum + ljus arbetsyta; schemat är ett tidrutnät med statusfärgade passbrickor. */
:root{
  --bg:#e9edf2; --surface:#ffffff; --surface-2:#f4f6f9; --ink:#14202c; --muted:#5a6677; --line:#d3d9e1; --line-strong:#aab4c0;
  --side:#132030; --side-ink:#c4d0dd; --side-muted:#7f8fa1; --side-hover:#1d2f43;
  --accent:#f0b429; --accent-ink:#5a3f00; --accent-soft:#fcefcf;
  --ok:#1f7146; --ok-soft:#dff1e6; --warn:#985a00; --warn-soft:#fbebcf; --err:#b42318; --err-soft:#fbe2de; --info:#225694; --info-soft:#e0eaf7;
  --weekend:#eef1f6; --holiday:#fbe9e4;
  --font-head:'Barlow Semi Condensed','Arial Narrow',system-ui,sans-serif;
  --font-body:'Source Sans 3',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
  --radius:6px; --shadow:0 10px 40px rgba(10,20,35,.25);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0e141b; --surface:#16202b; --surface-2:#1c2835; --ink:#e3e9ef; --muted:#95a3b3; --line:#2a3746; --line-strong:#41516380;
  --side:#0a1017; --side-ink:#c4d0dd; --side-muted:#738497; --side-hover:#152230;
  --accent:#f2b938; --accent-ink:#f6cf6f; --accent-soft:#3a2e10;
  --ok:#5cc58b; --ok-soft:#173225; --warn:#f0a94a; --warn-soft:#3a2a12; --err:#f28b7f; --err-soft:#3d1a17; --info:#7fb0ec; --info-soft:#172b44;
  --weekend:#131c26; --holiday:#2c1a18; --shadow:0 10px 40px rgba(0,0,0,.6); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0e141b; --surface:#16202b; --surface-2:#1c2835; --ink:#e3e9ef; --muted:#95a3b3; --line:#2a3746; --line-strong:#41516380;
  --side:#0a1017; --side-ink:#c4d0dd; --side-muted:#738497; --side-hover:#152230;
  --accent:#f2b938; --accent-ink:#f6cf6f; --accent-soft:#3a2e10;
  --ok:#5cc58b; --ok-soft:#173225; --warn:#f0a94a; --warn-soft:#3a2a12; --err:#f28b7f; --err-soft:#3d1a17; --info:#7fb0ec; --info-soft:#172b44;
  --weekend:#131c26; --holiday:#2c1a18; --shadow:0 10px 40px rgba(0,0,0,.6); color-scheme:dark }

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45}
h1,h2,h3{font-family:var(--font-head);font-weight:700;letter-spacing:.01em;text-wrap:balance;margin:0}
h1{font-size:28px} h2{font-size:21px} h3{font-size:17px}
button,input,select,textarea{font:inherit;color:inherit}
.num,td.n,th.n{font-variant-numeric:tabular-nums}
.mono{font-family:var(--font-mono);font-size:.86em}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.side{background:var(--side);color:var(--side-ink);padding-block:18px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.brand-mark{width:30px;height:30px;border-radius:5px;background:var(--accent);display:grid;place-items:center;color:#1a1300;font-family:var(--font-head);font-weight:700;font-size:17px}
.brand b{font-family:var(--font-head);font-size:21px;color:#fff;letter-spacing:.02em}
.brand small{display:block;color:var(--side-muted);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.who{display:grid;gap:4px;padding:0 6px}
.who label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--side-muted)}
.who select{background:var(--side-hover);border:1px solid #2b3d52;color:#fff;border-radius:var(--radius);padding:7px 8px;width:100%}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:var(--radius);color:var(--side-ink);font-weight:600}
.nav button:hover{background:var(--side-hover)}
.nav button[aria-current="page"]{background:var(--side-hover);color:#fff;box-shadow:inset 3px 0 0 var(--accent)}
.nav button:focus-visible{outline:2px solid var(--accent)}
.nav .count{font-size:12px;background:var(--err);color:#fff;border-radius:10px;padding:0 7px;font-variant-numeric:tabular-nums}
.nav .count.amber{background:var(--accent);color:#1a1300}
.side-foot{margin-top:auto;font-size:12px;color:var(--side-muted);padding:0 6px}

.main{min-width:0;padding-block:22px 60px;padding-left:max(16px,2.2vw);padding-right:max(16px,env(safe-area-inset-right,0px),2.2vw)}
.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px}
.page-head p{margin:4px 0 0;color:var(--muted);max-width:70ch}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.eyebrow{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-strong);background:var(--surface);border-radius:var(--radius);padding:6px 12px;cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#1a1300}
.btn.primary:hover{filter:brightness(.95)}
.btn.danger{color:var(--err);border-color:var(--err)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:3px 8px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:var(--radius);overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 11px;cursor:pointer;font-weight:600;font-size:14px}
.seg button+button{border-left:1px solid var(--line-strong)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.panel-b{padding:14px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.stack{display:grid;gap:16px}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;display:grid;gap:2px}
.kpi .v{font-family:var(--font-head);font-size:32px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.kpi .l{color:var(--muted);font-size:13px}
.kpi.err .v{color:var(--err)} .kpi.amber .v{color:var(--warn)}

.tbl-wrap{overflow-x:auto}
table.tbl{border-collapse:collapse;width:100%;font-size:14px}
.tbl th{text-align:left;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl td.n,.tbl th.n{text-align:right;white-space:nowrap}
.tbl tr.total td{font-weight:700;border-top:2px solid var(--line-strong)}
.tbl tr.click{cursor:pointer} .tbl tr.click:hover td{background:var(--surface-2)}
.muted{color:var(--muted)} .small{font-size:13px}

.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:1px 8px;border-radius:999px;white-space:nowrap;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.err{background:var(--err-soft);color:var(--err);border-color:transparent}
.pill.info{background:var(--info-soft);color:var(--info);border-color:transparent}
.pill.amber{background:var(--accent-soft);color:var(--accent-ink);border-color:transparent}

/* Schemarutnät */
.sched{border-collapse:separate;border-spacing:0;font-size:13px;min-width:100%}
.sched th,.sched td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:4px;vertical-align:top}
.sched thead th{position:sticky;top:0;background:var(--surface-2);z-index:2;font-weight:700;text-align:left;white-space:nowrap;padding:6px}
.sched thead th .d{font-family:var(--font-head);font-size:15px}
.sched thead th .h{display:block;font-size:11px;color:var(--err);font-weight:600;white-space:normal;max-width:110px}
.sched .rowh{text-align:left;position:sticky;left:0;background:var(--surface);z-index:1;min-width:190px;max-width:220px}
.sched thead .rowh{z-index:3;background:var(--surface-2)}
.sched .rowh b{display:block;font-size:14px}
.sched .rowh span{color:var(--muted);font-size:12px}
.sched td{min-width:104px;background:var(--surface)}
.sched td.we{background:var(--weekend)} .sched td.hol{background:var(--holiday)}
.sched td.today,.sched th.today{box-shadow:inset 0 3px 0 var(--accent)}
.sched tr.site td,.sched tr.site th{background:var(--surface-2);font-family:var(--font-head);font-size:15px;font-weight:700;letter-spacing:.02em;padding:6px 8px}
.sched td.wkstart,.sched th.wkstart{border-left:2px solid var(--line-strong)}
.chip{display:block;width:100%;text-align:left;border-radius:4px;padding:3px 6px;margin:0 0 3px;cursor:pointer;border:1px solid transparent;background:var(--surface-2);font-size:12.5px;line-height:1.25}
.chip:hover{border-color:var(--ink)}
.chip .t{display:block;font-family:var(--font-mono);font-size:11px;color:var(--muted)}
.chip.ordinary{background:var(--surface-2);border-color:var(--line)}
.chip.reassigned,.chip.extra{background:var(--info-soft);color:var(--info)}
.chip.vacant{background:var(--err-soft);color:var(--err);border:1px dashed var(--err);font-weight:700}
.chip.open{background:var(--accent-soft);color:var(--accent-ink);border:1px dashed var(--warn);font-weight:700}
.chip.cancelled{background:transparent;color:var(--muted);text-decoration:line-through;border:1px dashed var(--line)}
.chip .flag{float:right;font-weight:700;font-size:11px;padding:0 4px;border-radius:3px;margin-left:4px}
.chip .flag.err{background:var(--err);color:#fff} .chip .flag.warn{background:var(--warn);color:#fff}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--muted);margin:10px 0 0}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{display:inline-block;width:14px;height:10px;border-radius:2px}

/* Listor */
.list{display:grid}
.item{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .main-t{min-width:0;flex:1 1 260px}
.item .main-t b{font-weight:700}
.item .meta{color:var(--muted);font-size:13px}
.issue{display:flex;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);align-items:flex-start}
.issue:last-child{border-bottom:0}
.issue .msg{flex:1;min-width:0}
.issues-box{display:grid;gap:6px;margin:8px 0}
.issues-box .row{padding:7px 10px;border-radius:var(--radius);font-size:13.5px}
.issues-box .row.err{background:var(--err-soft);color:var(--err)}
.issues-box .row.warn{background:var(--warn-soft);color:var(--warn)}
.issues-box .row.ok{background:var(--ok-soft);color:var(--ok)}
.empty{padding:26px 14px;text-align:center;color:var(--muted)}

/* Formulär */
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px 14px}
.field{display:grid;gap:4px;min-width:0}
.field.full{grid-column:1/-1}
.field label,.lbl{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.field input,.field select,.field textarea,.inp{border:1px solid var(--line-strong);background:var(--surface);border-radius:var(--radius);padding:7px 9px;width:100%;min-width:0}
.field .hint{font-size:12.5px;color:var(--muted)}
.checks{display:flex;flex-wrap:wrap;gap:6px 14px}
.checks label{display:inline-flex;gap:6px;align-items:center;text-transform:none;letter-spacing:0;font-size:14px;color:var(--ink);font-weight:400}
.matrix{border-collapse:collapse;font-size:13px}
.matrix th,.matrix td{padding:4px 6px;text-align:center;border-bottom:1px solid var(--line)}
.matrix th:first-child,.matrix td:first-child{text-align:left;white-space:nowrap}
.matrix input{width:18px;height:18px}
.presets{display:flex;flex-wrap:wrap;gap:6px}
.note{font-size:13px;color:var(--muted);background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius);padding:9px 11px}
.inline-confirm{background:var(--err-soft);border:1px solid var(--err);border-radius:var(--radius);padding:10px 12px;display:grid;gap:8px}

/* Modal */
#modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
#modal .scrim{position:absolute;inset:0;background:rgba(8,14,22,.55)}
#modal .dialog{position:relative;background:var(--surface);border-radius:8px;box-shadow:var(--shadow);width:min(760px,100%);max-height:calc(100vh - 24px);overflow:auto;border:1px solid var(--line)}
#modal .dialog.wide{width:min(980px,100%)}
.dlg-h{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding:16px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:1}
.dlg-b{padding:16px 18px;display:grid;gap:16px}
.dlg-f{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line)}
.sect{display:grid;gap:8px}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0}

#toast{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:9px 16px;border-radius:var(--radius);font-weight:600;z-index:60;box-shadow:var(--shadow);max-width:calc(100% - 32px)}

@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:static;height:auto;flex-direction:column;gap:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px}
  .nav{flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:4px}
  .nav button{white-space:nowrap;padding:6px 10px}
  .nav button[aria-current="page"]{box-shadow:inset 0 -3px 0 var(--accent)}
  .side-foot{display:none}
  .main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  h1{font-size:24px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="app" id="app"></div>
<div id="modal" hidden><div class="scrim" data-act="closeModal"></div><div class="dialog" id="dialog" role="dialog" aria-modal="true"></div></div>
<div id="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
'use strict';
/* =========================================================
   Konstanter & hjälpfunktioner
   ========================================================= */
const WD = ['Mån','Tis','Ons','Tor','Fre','Lör','Sön'];
const WD_LONG = ['måndag','tisdag','onsdag','torsdag','fredag','lördag','söndag'];
const MONTHS = ['januari','februari','mars','april','maj','juni','juli','augusti','september','oktober','november','december'];
const STORE_KEY = 'vaktplan.data.v1';
const UI_KEY = 'vaktplan.ui.v1';

const FORMS = {
  tv:      {name:'Tillsvidareanställning', pay:'month', needsEnd:false},
  prov:    {name:'Provanställning', pay:'month', needsEnd:true, maxMonths:6},
  sv:      {name:'Särskild visstidsanställning', pay:'month', needsEnd:true},
  vikariat:{name:'Vikariat', pay:'month', needsEnd:true},
  sasong:  {name:'Säsongsanställning', pay:'month', needsEnd:true},
  behov:   {name:'Behovsanställning (timavlönad)', pay:'hour', needsEnd:false},
};
const CERTS = {vaktare:'Väktare', skyddsvakt:'Skyddsvakt', ordningsvakt:'Ordningsvakt'};
const ABS = {sjuk:'Sjuk', semester:'Semester', tjl:'Tjänstledig', vab:'VAB / föräldraledig', utb:'Utbildning', ovrigt:'Övrigt / omplanerat'};
const OBCATS = {kvall:'Kväll (mån–fre 18–22)', natt:'Natt (22–06)', helg:'Helg (lör–sön, helgdag)', storhelg:'Storhelg'};

const pad = n => String(n).padStart(2,'0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseISO = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (d,n) => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate()+n); return x; };
const wdIdx = d => (d.getDay()+6)%7;
const mondayOf = d => addDays(d, -wdIdx(d));
const dayDiff = (a,b) => Math.round((parseISO(iso(b)) - parseISO(iso(a))) / 864e5);
const tmin = t => { const [h,m] = String(t).split(':').map(Number); return (h||0)*60 + (m||0); };
const at = (ds, t) => { const d = parseISO(ds); d.setHours(0, tmin(t), 0, 0); return d; };
const today0 = () => parseISO(iso(new Date()));
function isoWeek(d){ const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); const day = t.getUTCDay()||7; t.setUTCDate(t.getUTCDate()+4-day); const y0 = new Date(Date.UTC(t.getUTCFullYear(),0,1)); return Math.ceil(((t-y0)/864e5+1)/7); }
const fmtD = d => `${d.getDate()}/${d.getMonth()+1}`;
const fmtT = d => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
const fmtLong = d => `${WD_LONG[wdIdx(d)]} ${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`;
const kr = n => (Math.round(n*100)/100).toLocaleString('sv-SE',{minimumFractionDigits:2, maximumFractionDigits:2}) + ' kr';
const num = (n,dec=2) => (Math.round(n*100)/100).toLocaleString('sv-SE',{minimumFractionDigits:0, maximumFractionDigits:dec});
const hrs = n => num(n,2);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = p => (p||'') + Math.random().toString(36).slice(2,9);
const r2 = n => Math.round(n*100)/100;

/* Svenska helgdagar */
function easter(y){ const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1; return new Date(y,mo-1,da); }
const holCache = {};
function holidays(y){
  if (holCache[y]) return holCache[y];
  const e = easter(y), H = {};
  const add = (d,name,st) => H[iso(d)] = {name, storhelg:!!st};
  add(new Date(y,0,1),'Nyårsdagen',1); add(new Date(y,0,6),'Trettondedag jul');
  add(addDays(e,-2),'Långfredagen',1); add(addDays(e,-1),'Påskafton',1); add(e,'Påskdagen',1); add(addDays(e,1),'Annandag påsk',1);
  add(new Date(y,4,1),'Första maj'); add(addDays(e,39),'Kristi himmelsfärdsdag'); add(addDays(e,49),'Pingstdagen'); add(new Date(y,5,6),'Nationaldagen');

const empById = id => D.employees.find(e => e.id===id);
const siteById = id => D.sites.find(s => s.id===id);

function seriesOccursOn(s, d){
  const ds = iso(d);
  if (!s.start || ds < s.start) return false;
  if (s.end && ds > s.end) return false;
  const anchor = mondayOf(parseISO(s.start));
  const w = Math.floor(dayDiff(anchor, d) / 7);
  const cyc = Math.max(1, s.cycle|0);
  const idx = ((w % cyc) + cyc) % cyc;
  return (s.days[idx] || []).includes(wdIdx(d));
}
function shiftTimes(ds, from, to){ const start = at(ds, from); let end = at(ds, to); if (end <= start) end = at(iso(addDays(parseISO(ds),1)), to); return {start, end}; }

function occurrences(from, to){
  const out = [];
  for (let d = new Date(from); d <= to; d = addDays(d,1)){
    const ds = iso(d);
    for (const s of D.series){
      if (!seriesOccursOn(s, d)) continue;
      const id = s.id + '@' + ds;
      const o = D.overrides[id] || {};
      const {start, end} = shiftTimes(ds, s.from, s.to);
      let status, personId;
      if (o.cancelled){ status = 'cancelled'; personId = null; }
      else if ('personId' in o){
        personId = o.personId;
        if (!personId) status = o.open ? 'open' : 'vacant';
        else status = personId === s.personId ? 'ordinary' : 'reassigned';
      } else { personId = s.personId || null; status = personId ? 'ordinary' : (o.open ? 'open' : 'vacant'); }
      if (personId && !empById(personId)){ personId = null; status = 'vacant'; }
      out.push({id, kind:'series', seriesId:s.id, date:ds, start, end, siteId:s.siteId, name:s.name, ordinaryId:s.personId||null,
        personId, status, absence:o.absence||null, overridden: !!D.overrides[id], breakMin:s.breakMin||0, requires:s.requires||''});
    }
  }
  const f = iso(from), t = iso(to);
  for (const x of D.singles){
    if (x.date < f || x.date > t) continue;
    const {start, end} = shiftTimes(x.date, x.from, x.to);
    let personId = x.personId && empById(x.personId) ? x.personId : null;
    const status = x.cancelled ? 'cancelled' : personId ? 'extra' : (x.open ? 'open' : 'vacant');
    if (x.cancelled) personId = null;
    out.push({id:'x:'+x.id, kind:'single', singleId:x.id, date:x.date, start, end, siteId:x.siteId, name:x.name, ordinaryId:null,
      personId, status, absence:null, overridden:false, breakMin:x.breakMin||0, requires:x.requires||''});
  }
  out.sort((a,b) => a.start - b.start || a.name.localeCompare(b.name));
  return out;
}
function getOcc(id){
  let ds;
  if (id.startsWith('x:')){ const x = D.singles.find(s => 'x:'+s.id===id); if (!x) return null; ds = x.date; }
  else ds = id.split('@')[1];
  const d = parseISO(ds);
  return occurrences(d, d).find(o => o.id===id) || null;
}
const hoursOf = o => Math.max(0, (o.end - o.start)/36e5 - (o.breakMin||0)/60);
const grossH = o => (o.end - o.start)/36e5;
const occLabel = o => `${o.name} ${fmtD(o.start)} ${fmtT(o.start)}–${fmtT(o.end)}`;
const STATUS = {ordinary:['Ordinarie',''], reassigned:['Omfördelat','info'], extra:['Extrapass','info'], vacant:['Vakant','err'], open:['Fritt att boka','amber'], cancelled:['Inställt','']};

function setOcc(occ, patch){
  if (occ.kind === 'single'){
    const x = D.singles.find(s => s.id===occ.singleId);
    if ('personId' in patch) x.personId = patch.personId;
    if ('open' in patch) x.open = patch.open;
    if ('cancelled' in patch) x.cancelled = patch.cancelled;
  } else {
    const s = seriesById(occ.seriesId);
    const o = Object.assign({}, D.overrides[occ.id] || {}, patch);
    if (!o.cancelled && 'personId' in o && o.personId && o.personId === s.personId && !o.open){ delete D.overrides[occ.id]; }
    else D.overrides[occ.id] = o;
  }
  save();
}

/* =========================================================
   Regelkontroll (ATL + avtal)
   ========================================================= */
function maxFree(intervals, ws, we){
  let best = 0, cur = ws;
  for (const [a,b] of intervals){ const st = Math.max(a, ws); if (st > cur) best = Math.max(best, st - cur); cur = Math.max(cur, Math.min(b, we)); }
  return Math.max(best, we - cur);
}
function checkPerson(emp, shifts){
  const R = D.settings.rules; const issues = [];
  const add = (level, rule, msg, ids, key) => issues.push({level, rule, msg, shifts:ids, key: key || (rule+':'+ids.join(',')), personId: emp.id});
  for (let i=0;i<shifts.length;i++){
    const s = shifts[i], len = grossH(s);
    if (len > 13) add('error','Passlängd',`Passet är ${hrs(len)} h. Det ger inte utrymme för 11 h dygnsvila inom 24 h (ATL 13 §).`,[s.id]);
    else if (len > R.maxShift) add('warn','Passlängd',`Passet är ${hrs(len)} h, längre än tillåtna ${R.maxShift} h.`,[s.id]);
    if (i>0 && shifts[i-1].end > s.start) add('error','Dubbelbokning',`Överlappar ${occLabel(shifts[i-1])}.`,[shifts[i-1].id, s.id]);
    if ((emp.start && s.date < emp.start) || (emp.end && s.date > emp.end)) add('error','Anställning',`Passet ligger utanför anställningsperioden (${emp.start||'…'} – ${emp.end||'tills vidare'}).`,[s.id]);
    if (s.requires && !(emp.certs||[]).includes(s.requires)) add('warn','Behörighet',`Passet kräver behörighet som ${CERTS[s.requires]||s.requires}.`,[s.id]);
  }
  // Dygnsvila: varje 24-timmarsperiod från ett passtart ska ha minst X h sammanhängande vila
  for (let i=0;i<shifts.length;i++){
    const ws = shifts[i].start.getTime(), we = ws + 864e5;
    const win = []; for (let j=i; j<shifts.length && shifts[j].start.getTime() < we; j++) win.push(shifts[j]);
    if (win.length < 2) continue;
    const free = maxFree(win.map(s => [s.start.getTime(), s.end.getTime()]), ws, we) / 36e5;
    if (free < R.minDailyRest - 1e-9){
      const last = win[win.length-1], prev = win[win.length-2];
      const gap = Math.max(0, (last.start - prev.end)/36e5);
      add('error','Dygnsvila',`${hrs(gap)} h vila mellan ${occLabel(prev)} och ${occLabel(last)}. Krav: ${R.minDailyRest} h sammanhängande vila per 24 h (ATL 13 §).`,[prev.id,last.id],'dygn:'+prev.id+','+last.id);
    }
  }
  // Veckovila per kalendervecka & snittarbetstid
  const weeks = new Map();
  for (const s of shifts){ for (const k of new Set([iso(mondayOf(s.start)), iso(mondayOf(new Date(s.end.getTime()-1)))])){ if (!weeks.has(k)) weeks.set(k, []); weeks.get(k).push(s); } }
  const weekHours = new Map();
  for (const s of shifts){ const k = iso(mondayOf(s.start)); weekHours.set(k, (weekHours.get(k)||0) + hoursOf(s)); }
  for (const [k, list] of weeks){
    const ws = parseISO(k).getTime(), we = addDays(parseISO(k),7).getTime();
    const free = maxFree(list.map(s => [s.start.getTime(), s.end.getTime()]).sort((a,b)=>a[0]-b[0]), ws, we) / 36e5;
    if (free < R.minWeeklyRest - 1e-9) add('error','Veckovila',`Vecka ${isoWeek(parseISO(k))}: längsta sammanhängande ledighet är ${hrs(free)} h. Krav: ${R.minWeeklyRest} h per sjudagarsperiod (ATL 14 §).`, list.map(s=>s.id), 'vecka:'+emp.id+':'+k);
    const n = Math.max(1, R.avgWeeks|0); let sum = 0;
    for (let w=0; w<n; w++) sum += weekHours.get(iso(addDays(parseISO(k), -7*w))) || 0;
    const avg = sum / n;
    if (avg > R.maxAvgWeek + 1e-9 && weekHours.get(k)) add('warn','Arbetstid',`I snitt ${hrs(avg)} h/vecka under ${n} veckor fram till v.${isoWeek(parseISO(k))}. Max ${R.maxAvgWeek} h sammanlagd arbetstid i snitt (ATL 10 b §).`, list.filter(s=>iso(mondayOf(s.start))===k).map(s=>s.id), 'snitt:'+emp.id+':'+k);
  }
  // Övertid per kalendermånad för heltidsanställda månadsavlönade
  if (FORMS[emp.form]?.pay === 'month' && (emp.grad||0) >= 100){
    const months = new Map();
    for (const s of shifts){ if (s.kind==='single' || s.ordinaryId !== emp.id){ const k = s.date.slice(0,7); if (!months.has(k)) months.set(k, []); months.get(k).push(s); } }
    for (const [k, list] of months){ const h = list.reduce((a,s)=>a+hoursOf(s),0); if (h > R.maxOtMonth) add('warn','Övertid',`${hrs(h)} h extratid i ${MONTHS[+k.slice(5)-1]}. Max ${R.maxOtMonth} h allmän övertid per månad (ATL 8 §).`, list.map(s=>s.id), 'ot:'+emp.id+':'+k); }
  }
  const seen = new Set();
  return issues.filter(i => seen.has(i.key) ? false : (seen.add(i.key), true));
}
const memo = new Map();
function analyze(from, to){
  const key = VER+'|'+iso(from)+'|'+iso(to);
  if (memo.has(key)) return memo.get(key);
  const occs = occurrences(addDays(from,-35), addDays(to,35));
  const byOcc = new Map(), list = [], f = iso(from), t = iso(to), byId = new Map(occs.map(o=>[o.id,o]));
  for (const emp of D.employees){
    const shifts = occs.filter(o => o.personId===emp.id && o.status!=='cancelled');
    if (!shifts.length) continue;
    for (const is of checkPerson(emp, shifts)){
      for (const id of is.shifts){ if (!byOcc.has(id)) byOcc.set(id, []); byOcc.get(id).push(is); }
      if (is.shifts.some(id => { const o = byId.get(id); return o && o.date >= f && o.date <= t; })) list.push(is);
    }
  }
  const inRange = occs.filter(o => o.date >= f && o.date <= t);
  const res = {occs: inRange, all: occs, byOcc, list, byId};
  if (memo.size > 30) memo.clear();
  memo.set(key, res);
  return res;
}
function simulate(occ, pid, pool){
  const emp = empById(pid); if (!emp) return [];
  const occs = pool || occurrences(addDays(occ.start,-35), addDays(occ.start,35));
  const shifts = occs.filter(o => o.personId===pid && o.status!=='cancelled' && o.id!==occ.id);
  shifts.push(Object.assign({}, occ, {personId:pid, status: occ.kind==='single' ? 'extra' : (pid===occ.ordinaryId ? 'ordinary':'reassigned')}));
  shifts.sort((a,b)=>a.start-b.start);
  return checkPerson(emp, shifts).filter(i => i.shifts.includes(occ.id));
}
const worst = list => list.some(i=>i.level==='error') ? 'error' : list.length ? 'warn' : null;

/* =========================================================
   Lön
   ========================================================= */
function obCat(d){
  const h = holiday(d);
  if (h && h.storhelg) return 'storhelg';
  if (h || wdIdx(d) >= 5) return 'helg';
  const hr = d.getHours();
  if (hr >= 22 || hr < 6) return 'natt';
  if (hr >= 18) return 'kvall';
  return null;
}
const isEnkelOt = d => !holiday(d) && wdIdx(d) < 5 && d.getHours() >= 6 && d.getHours() < 20;
const splitCache = new Map();
function obSplit(o){
  const key = o.start.getTime()+'-'+o.end.getTime();
  if (splitCache.has(key)) return splitCache.get(key);
  const r = {kvall:0, natt:0, helg:0, storhelg:0, enkel:0, kval:0, total:0};
  for (let t = o.start.getTime(); t < o.end.getTime(); t += 6e4){ const d = new Date(t); const c = obCat(d); if (c) r[c]++; if (isEnkelOt(d)) r.enkel++; else r.kval++; r.total++; }
  splitCache.set(key, r); return r;
}
function monthRange(ym){ const [y,m] = ym.split('-').map(Number); return [new Date(y,m-1,1), new Date(y,m,0)]; }
function calcPay(emp, ym, occsMonth){
  const S = D.settings, lg = lgOf(emp), mlon = lg ? lg.salary : 0, tim = mlon / S.divisor;
  const hourly = FORMS[emp.form]?.pay === 'hour', grad = hourly ? 0 : (emp.grad||0);
  const occs = occsMonth || (() => { const [a,b] = monthRange(ym); return occurrences(a,b); })();
  const worked = occs.filter(o => o.personId===emp.id && o.status!=='cancelled');
  const absent = occs.filter(o => o.kind==='series' && o.ordinaryId===emp.id && ['vacant','open','reassigned'].includes(o.status));
  let ord=0, extra=0, enkel=0, kval=0, atfH=0; const ob = {kvall:0, natt:0, helg:0, storhelg:0};
  const shiftRows = [];
  for (const o of worked){
    const h = hoursOf(o), sp = obSplit(o), f = sp.total ? (h*60/sp.total)/60 : 0;
    const isOrd = o.kind==='series' && o.ordinaryId===emp.id;
    if (isOrd || hourly) ord += h; else { extra += h; enkel += sp.enkel*f; kval += sp.kval*f; }
    let obh = 0;
    for (const c in ob){ ob[c] += sp[c]*f; obh += sp[c]*f; atfH += sp[c]*f*(S.atf[c]||0)/60; }
    shiftRows.push({o, h, obh, type: hourly ? 'Timlön' : isOrd ? 'Ordinarie' : (grad<100 ? 'Mertid' : 'Övertid')});
  }
  const lines = [];
  const L = (text, qty, price, amount, kind) => lines.push({text, qty, price, amount: r2(amount ?? (qty*price)), kind: kind||'pay'});
  if (hourly) { if (ord) L('Timlön', ord, tim); }
  else L(`Månadslön (${grad} %)`, null, null, mlon*grad/100);
  if (!hourly && extra){
    if (grad < 100) L('Mertid', extra, tim);
    else { if (enkel) L('Övertid, enkel (mån–fre 06–20)', enkel, mlon/S.otEnkel); if (kval) L('Övertid, kvalificerad', kval, mlon/S.otKval); }
  }
  for (const c in ob) if (ob[c] > 0.001) L('OB-tillägg ' + OBCATS[c].toLowerCase(), ob[c], S.ob[c]);
  const absH = {};
  for (const o of absent){ const r = o.absence || 'ovrigt'; absH[r] = (absH[r]||0) + hoursOf(o); }
  if (!hourly){
    if (absH.sjuk){
      L('Sjukavdrag', absH.sjuk, -tim);
      L(`Sjuklön ${S.sickPct} %`, absH.sjuk, tim*S.sickPct/100);
      const veckoSjuklon = (S.sickPct/100) * (mlon*grad/100) * 12 / 52;
      L(`Karensavdrag (${S.karensPct} % av veckosjuklön)`, null, null, -veckoSjuklon*S.karensPct/100);
    }
    if (absH.tjl) L('Avdrag tjänstledighet', absH.tjl, -tim);
    if (absH.vab) L('Avdrag VAB / föräldraledighet', absH.vab, -tim);
    for (const r of ['semester','utb','ovrigt']) if (absH[r]) L(`${ABS[r]} (ingen löneändring)`, absH[r], 0, 0, 'info');
  }
  if (S.atfMode === 'utbetalning' && atfH > 0.001) L('Arbetstidsförkortning, utbetalning', atfH, tim);
  if (hourly){
    const base = lines.filter(l => l.amount > 0).reduce((a,l)=>a+l.amount,0);
    if (base) L(`Semesterersättning ${S.semErs} %`, null, null, base*S.semErs/100);
  }
  const brutto = r2(lines.reduce((a,l)=>a+l.amount,0));
  const obH = Object.values(ob).reduce((a,b)=>a+b,0), obKr = Object.keys(ob).reduce((a,c)=>a+ob[c]*S.ob[c],0);
  const absTot = Object.values(absH).reduce((a,b)=>a+b,0);
  return {emp, lg, mlon, tim, hourly, grad, ord, extra, enkel, kval, ob, obH, obKr, absH, absTot, atfH, lines, brutto, shiftRows};
}
function atfYTD(emp, ym){
  const [y,m] = ym.split('-').map(Number); let tot = 0;
  const occs = occurrences(new Date(y,0,1), new Date(y,m,0));
  for (let i=1;i<=m;i++){ const k = `${y}-${pad(i)}`; tot += calcPay(emp, k, occs.filter(o=>o.date.slice(0,7)===k)).atfH; }
  return tot;
}

const VIEWS = {};
VIEWS.overview = () => {

      <div class="list">${[...vac, ...open].sort((a,b)=>a.start-b.start).slice(0,8).map(o => `<div class="item"><div class="main-t"><b>${WD[wdIdx(o.start)]} ${fmtD(o.start)}</b> <span class="mono">${fmtT(o.start)}–${fmtT(o.end)}</span> ${esc(o.name)}<div class="meta">${esc(siteById(o.siteId)?.name||'')}${o.absence?` · ${ABS[o.absence]} (${esc(firstName(o.ordinaryId))})`:''}</div></div><div class="toolbar">${statusPill(o)}<button class="btn sm primary" data-act="shift" data-id="${esc(o.id)}">Tilldela</button></div></div>`).join('') || '<div class="empty">Alla pass de närmaste 14 dagarna är bemannade.</div>'}</div></section>

function issueRow(i){
  return `<div class="issue"><span class="pill ${i.level==='error'?'err':'warn'}">${esc(i.rule)}</span><div class="msg"><b>${esc(empName(i.personId))}</b> · ${esc(i.msg)}</div><div class="toolbar">${i.shifts.slice(-2).map(id => `<button class="btn sm" data-act="shift" data-id="${esc(id)}">${esc(shortId(id))}</button>`).join('')}</div></div>`;
}
function shortId(id){ const ds = id.startsWith('x:') ? (D.singles.find(s=>'x:'+s.id===id)||{}).date : id.split('@')[1]; if (!ds) return 'Pass'; const d = parseISO(ds); return `${WD[wdIdx(d)]} ${fmtD(d)}`; }

VIEWS.schedule = () => {
  const weeks = UI.schedWeeks; const from = UI.schedStart, to = addDays(from, weeks*7-1);
  const A = analyze(from, to); const t0 = iso(today0());
  const days = []; for (let d = new Date(from); d <= to; d = addDays(d,1)) days.push(d);
  const head = `<tr><th class="rowh">${UI.schedMode==='pass'?'Pass':'Personal'}</th>${days.map(d => { const h = holiday(d); return `<th class="${iso(d)===t0?'today':''} ${wdIdx(d)===0?'wkstart':''}"><span class="d">${WD[wdIdx(d)]} ${fmtD(d)}</span>${wdIdx(d)===0?` <span class="muted small">v.${isoWeek(d)}</span>`:''}${h?`<span class="h">${esc(h.name)}</span>`:''}</th>`; }).join('')}</tr>`;
  const cellCls = d => { const h = holiday(d); return [h?'hol':(wdIdx(d)>=5?'we':''), iso(d)===t0?'today':'', wdIdx(d)===0?'wkstart':''].join(' '); };
  let body = '';
  if (UI.schedMode === 'pass'){
    for (const site of D.sites){
      const ser = D.series.filter(s => s.siteId===site.id && A.occs.some(o => o.seriesId===s.id));
      const singles = A.occs.filter(o => o.kind==='single' && o.siteId===site.id);
      if (!ser.length && !singles.length) continue;
      body += `<tr class="site"><th class="rowh" colspan="1">${esc(site.name)}</th><td colspan="${days.length}"></td></tr>`;
      for (const s of ser){
        body += `<tr><th class="rowh"><b>${esc(s.name)}</b><span class="mono">${s.from}–${s.to}</span> <span>· ord. ${esc(s.personId?firstName(s.personId):'ingen')}</span></th>${days.map(d => { const o = A.occs.find(x => x.seriesId===s.id && x.date===iso(d)); return `<td class="${cellCls(d)}">${o ? chipHtml(o, A.byOcc.get(o.id)) : ''}</td>`; }).join('')}</tr>`;
      }
      if (singles.length) body += `<tr><th class="rowh"><b>Extrapass</b><span>enstaka pass</span></th>${days.map(d => `<td class="${cellCls(d)}">${singles.filter(o=>o.date===iso(d)).map(o=>chipHtml(o, A.byOcc.get(o.id))).join('')}</td>`).join('')}</tr>`;
    }
  } else {
    const unstaffed = A.occs.filter(o => !o.personId && o.status!=='cancelled');
    body += `<tr><th class="rowh"><b>Obemannat</b><span>vakanta och fria pass</span></th>${days.map(d => `<td class="${cellCls(d)}">${unstaffed.filter(o=>o.date===iso(d)).map(o=>chipHtml(o, null, 'person')).join('')}</td>`).join('')}</tr>`;
    for (const e of D.employees){
      const mine = A.occs.filter(o => o.personId===e.id);
      const h = mine.reduce((a,o)=>a+hoursOf(o),0);
      body += `<tr><th class="rowh"><b>${esc(e.name)}</b><span>${FORMS[e.form].pay==='hour'?'Timavlönad':e.grad+' %'} · ${hrs(h)} h i perioden</span></th>${days.map(d => `<td class="${cellCls(d)}">${mine.filter(o=>o.date===iso(d)).map(o=>chipHtml(o, A.byOcc.get(o.id), 'person')).join('')}</td>`).join('')}</tr>`;
    }
  }
  return `
  <div class="page-head"><div><div class="eyebrow">Vecka ${isoWeek(from)}${weeks>1?'–'+isoWeek(to):''} · ${fmtD(from)} – ${fmtD(to)} ${to.getFullYear()}</div><h1>Schema</h1><p>Klicka på ett pass för att byta personal, göra det vakant eller lägga ut det som fritt att boka.</p></div>
    <div class="toolbar"><button class="btn primary" data-act="newSingle">+ Extrapass</button><button class="btn" data-act="expSched" data-k="pdf">PDF</button><button class="btn" data-act="expSched" data-k="xlsx">Excel</button></div></div>
  <div class="toolbar" style="margin-bottom:12px">
    <div class="seg"><button data-act="schedNav" data-d="-1" aria-label="Föregående period">←</button><button data-act="schedNav" data-d="0">Denna vecka</button><button data-act="schedNav" data-d="1" aria-label="Nästa period">→</button></div>
    <div class="seg">${[1,2,4].map(w => `<button data-act="schedWeeks" data-w="${w}" aria-pressed="${UI.schedWeeks===w}">${w} v</button>`).join('')}</div>
    <div class="seg"><button data-act="schedMode" data-m="pass" aria-pressed="${UI.schedMode==='pass'}">Per pass</button><button data-act="schedMode" data-m="person" aria-pressed="${UI.schedMode==='person'}">Per person</button></div>
  </div>
  <div class="panel tbl-wrap"><table class="sched"><thead>${head}</thead><tbody>${body || `<tr><td colspan="${days.length+1}" class="empty">Inga pass i perioden.</td></tr>`}</tbody></table></div>
  <div class="legend"><span><i style="background:var(--surface-2);border:1px solid var(--line)"></i>Ordinarie</span><span><i style="background:var(--info-soft)"></i>Omfördelat / extrapass</span><span><i style="background:var(--err-soft);border:1px dashed var(--err)"></i>Vakant</span><span><i style="background:var(--accent-soft);border:1px dashed var(--warn)"></i>Fritt att boka</span><span><b style="color:var(--err)">ATL</b> bryter mot arbetstidsregel</span><span><b style="color:var(--warn)">!</b> varning</span></div>`;
};

function parseDays(txt){
  const names = ['mån','tis','ons','tor','fre','lör','sön'];
  const re = /(mån|tis|ons|tor|fre|lör|sön)[a-zåäö]*(?:\s*[-–]\s*(mån|tis|ons|tor|fre|lör|sön)[a-zåäö]*)?/g;
  const out = new Set(); let m;
  while ((m = re.exec(txt))){ const a = names.indexOf(m[1]); const b = m[2] ? names.indexOf(m[2]) : a; let i = a; for (let k=0;k<7;k++){ out.add(i); if (i===b) break; i = (i+1)%7; } }
  return [...out].sort((a,b)=>a-b);
}
function parsePattern(txt){
  const t = txt.toLowerCase();
  const m = t.match(/(\d{1,2})(?:[:.](\d{2}))?\s*[-–]\s*(\d{1,2})(?:[:.](\d{2}))?/);
  if (!m) return null;
  const from = pad(+m[1]%24)+':'+(m[2]||'00'), to = pad(+m[3]%24)+':'+(m[4]||'00');
  const rest = t.replace(/\d{1,2}(?:[:.]\d{2})?\s*[-–]\s*\d{1,2}(?:[:.]\d{2})?/g,' ');
  let weeks = rest.split(/\||;|\bvecka\s*2\b|\bv2\b|\boch sedan\b/).map(parseDays).filter(w=>w.length);
  let cycle = weeks.length || 1;
  if (/varannan/.test(t) && cycle < 2) cycle = 2;
  if (/var tredje/.test(t) && cycle < 3) cycle = 3;
  if (/var fjärde/.test(t) && cycle < 4) cycle = 4;
  const days = Array.from({length:cycle}, (_,i)=>weeks[i]||[]);
  return {from, to, cycle, days};
}

        ${Array.from({length:c}, (_,w) => `<tr><td>Vecka ${w+1}${c>1?` <span class="muted small">(v.${isoWeek(addDays(anchor,7*w))}, v.${isoWeek(addDays(anchor,7*(w+c)))} …)</span>`:''}</td>${WD.map((_,i)=>`<td><input type="checkbox" id="dd${w}_${i}" aria-label="Vecka ${w+1} ${WD_LONG[i]}" data-chg="draftDay" data-w="${w}" data-d="${i}" ${(d.days[w]||[]).includes(i)?'checked':''}></td>`).join('')}</tr>`).join('')}
        </tbody></table></div>
        <div class="note"><b>${esc(patternText(d))}</b> · i snitt ${hrs(wh)} h/vecka${capH!=null?` · ordinarie personens grad motsvarar ${hrs(capH)} h/vecka`:''}<br>Nästa pass: ${prev.map(x=>`${WD[wdIdx(x)]} ${fmtD(x)}`).join(', ') || 'inga inom 4 veckor'}</div>
      </div>
      ${UI.formErr?`<div class="issues-box"><div class="row err">${esc(UI.formErr)}</div></div>`:''}
    </div>
    <div class="dlg-f">${s?`<button class="btn danger" data-act="askDelSeries" data-id="${s.id}">Ta bort</button>`:''}<button class="btn" data-act="closeModal">Avbryt</button><button class="btn primary" data-act="saveSeries">Spara</button></div>`;
  }, true);
}
function syncDraft(){
  const d = UI.draft; if (!d) return; const v = id => { const el = document.getElementById(id); return el ? el.value : undefined; };
  d.name = v('dName') ?? d.name; d.siteId = v('dSite') ?? d.siteId; d.from = v('dFrom') || d.from; d.to = v('dTo') || d.to;
  d.breakMin = Math.max(0, +(v('dBreak') ?? d.breakMin) || 0); d.requires = v('dReq') ?? d.requires; d.start = v('dStart') ?? d.start; d.end = v('dEnd') ?? d.end;
  d.cycle = +(v('dCycle') ?? d.cycle) || 1; d.personId = v('dPerson') ?? d.personId;
}

function singleDialog(){
  const t0 = today0();
  showModal(() => `
    <div class="dlg-h"><div><div class="eyebrow">Enstaka pass</div><h2>Nytt extrapass</h2></div><button class="btn ghost" data-act="closeModal" aria-label="Stäng">✕</button></div>
    <div class="dlg-b"><div class="form">
      <div class="field"><label for="xName">Namn</label><input id="xName" value="" placeholder="t.ex. Arena: match"></div>
      <div class="field"><label for="xSite">Objekt</label><select id="xSite">${D.sites.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></div>
      <div class="field"><label for="xDate">Datum</label><input id="xDate" type="date" value="${iso(addDays(t0,1))}"></div>
      <div class="field"><label for="xFrom">Starttid</label><input id="xFrom" type="time" value="18:00"></div>
      <div class="field"><label for="xTo">Sluttid</label><input id="xTo" type="time" value="23:00"></div>
      <div class="field"><label for="xBreak">Obetald rast (min)</label><input id="xBreak" type="number" min="0" step="5" value="0"></div>
      <div class="field"><label for="xReq">Behörighetskrav</label><select id="xReq"><option value="">Inget</option>${Object.entries(CERTS).map(([k,v])=>`<option value="${k}" ${k==='vaktare'?'selected':''}>${v}</option>`).join('')}</select></div>
      <div class="field"><label for="xCount">Antal pass</label><input id="xCount" type="number" min="1" max="20" value="1"></div>
      <div class="field"><label for="xMode">Bemanning</label><select id="xMode"><option value="open">Lägg ut som fritt att boka</option><option value="vacant">Vakant (tilldelas senare)</option>${D.employees.map(e=>`<option value="${e.id}">${esc(e.name)}</option>`).join('')}</select></div>
    </div>${UI.formErr?`<div class="issues-box"><div class="row err">${esc(UI.formErr)}</div></div>`:''}</div>
    <div class="dlg-f"><button class="btn" data-act="closeModal">Avbryt</button><button class="btn primary" data-act="saveSingle">Skapa</button></div>`);
}

function empDialog(id){
  const e = id ? empById(id) : {id:'', name:'', role:'personal', form:'tv', grad:100, lg:D.settings.lonegrupper[0]?.id, certs:['vaktare'], start:iso(today0()), end:'', phone:'', email:''};
  UI.empForm = e.form;
  showModal(() => {
    const form = UI.empForm; const F = FORMS[form];
    const ser = id ? D.series.filter(s=>s.personId===id) : [];
    return `
    <div class="dlg-h"><div><div class="eyebrow">${id?'Redigera':'Ny'} personal</div><h2>${esc(e.name||'Ny anställd')}</h2></div><button class="btn ghost" data-act="closeModal" aria-label="Stäng">✕</button></div>
    <div class="dlg-b"><div class="form">
      <div class="field"><label for="eName">Namn</label><input id="eName" value="${esc(e.name)}"></div>
      <div class="field"><label for="eRole">Roll</label><select id="eRole"><option value="personal" ${e.role==='personal'?'selected':''}>Personal</option><option value="arbetsledare" ${e.role==='arbetsledare'?'selected':''}>Arbetsledare</option></select></div>
      <div class="field"><label for="eForm">Anställningsform</label><select id="eForm" data-chg="empForm">${Object.entries(FORMS).map(([k,v])=>`<option value="${k}" ${form===k?'selected':''}>${v.name}</option>`).join('')}</select>
        <span class="hint">${form==='prov'?'Högst 6 månader, övergår annars i tillsvidareanställning.':form==='behov'?'Arbetar vid behov, timlön och semesterersättning.':form==='sv'?'Särskild visstidsanställning, LAS 5 §.':F.needsEnd?'Tidsbegränsad: ange slutdatum.':'Gäller tills vidare.'}</span></div>
      <div class="field"><label for="eGrad">Sysselsättningsgrad %</label><input id="eGrad" type="number" min="0" max="100" step="5" value="${F.pay==='hour'?0:e.grad}" ${F.pay==='hour'?'disabled':''}><span class="hint">100 = heltid, under 100 = deltid</span></div>
      <div class="field"><label for="eLg">Lönegrupp</label><select id="eLg">${D.settings.lonegrupper.map(g=>`<option value="${g.id}" ${g.id===e.lg?'selected':''}>${esc(g.name)} (${num(g.salary,0)} kr)</option>`).join('')}</select></div>
      <div class="field"><span class="lbl">Behörighet</span><div class="checks">${Object.entries(CERTS).map(([k,v])=>`<label><input type="checkbox" id="ec_${k}" ${(e.certs||[]).includes(k)?'checked':''}>${v}</label>`).join('')}</div></div>
      <div class="field"><label for="eStart">Anställd från</label><input id="eStart" type="date" value="${e.start||''}"></div>
      <div class="field"><label for="eEnd">Anställd till</label><input id="eEnd" type="date" value="${e.end||''}"><span class="hint">${F.needsEnd?'Krävs för tidsbegränsad anställning':'Lämna tomt'}</span></div>
      <div class="field"><label for="ePhone">Telefon</label><input id="ePhone" value="${esc(e.phone||'')}"></div>
      <div class="field"><label for="eEmail">E-post</label><input id="eEmail" type="email" value="${esc(e.email||'')}"></div>
    </div>
    ${ser.length?`<div class="note">Ordinarie på: ${ser.map(s=>`${esc(s.name)} (${esc(siteById(s.siteId)?.name||'')})`).join(', ')}</div>`:''}
    ${UI.formErr?`<div class="issues-box"><div class="row err">${esc(UI.formErr)}</div></div>`:''}
    ${id ? confirmBox('delEmp:'+id, `Ta bort <b>${esc(e.name)}</b>? Ordinarie pass och tilldelade pass blir vakanta.`, 'Ta bort', 'delEmp', `data-id="${id}"`) : ''}
    </div>
    <div class="dlg-f">${id?`<button class="btn danger" data-act="askDelEmp" data-id="${id}">Ta bort</button>`:''}<button class="btn" data-act="closeModal">Avbryt</button><button class="btn primary" data-act="saveEmp" data-id="${id||''}">Spara</button></div>`;
  });
}

/* =========================================================
   Händelser
   ========================================================= */
const ACT = {
  nav: d => { UI.view = d.v; UI.confirm = null; UI.bookCheck = null; render(); window.scrollTo(0,0); },
  closeModal: () => { UI.formErr = null; UI.confirm = null; closeModal(); },
  shift: d => shiftDialog(d.id),
  schedNav: d => { const n = +d.d; UI.schedStart = n===0 ? mondayOf(today0()) : addDays(UI.schedStart, n*7*UI.schedWeeks); render(); },
  schedWeeks: d => { UI.schedWeeks = +d.w; render(); },
  schedMode: d => { UI.schedMode = d.m; render(); },
  ruleWeeks: d => { UI.ruleWeeks = +d.w; render(); },
  expSched: d => exportSchedule(d.k, UI.schedStart, addDays(UI.schedStart, UI.schedWeeks*7-1)),
  expMine: d => { const f = mondayOf(today0()); exportSchedule(d.k, f, addDays(f,41), me().id); },
  expPay: d => exportPayroll(d.k, UI.payMonth),
  expSpec: d => exportPayroll('pdf', d.ym, d.id),
  expStaff: d => exportStaff(d.k),
  assign: d => {
    const o = getOcc(d.id); const pid = UI.selCand; if (!o || !pid) return;
    const is = simulate(o, pid);
    if (is.some(i=>i.level==='error') && !d.force){ UI.pendingForce = o.id+'|'+pid; refreshModal(); return; }
    setOcc(o, {personId:pid, open:false, cancelled:false});
    UI.pendingForce = null; closeModal(); render(); toast(`${empName(pid)} tilldelad ${o.name} ${fmtD(o.start)}`);
  },
  makeVacant: d => { const o = getOcc(d.id); const r = document.getElementById('absReason'); const patch = {personId:null, open:false}; if (r && o.kind==='series') patch.absence = r.value; setOcc(o, patch); closeModal(); render(); toast('Passet är vakant'); },
  makeOpen: d => { const o = getOcc(d.id); const r = document.getElementById('absReason'); const patch = {personId:null, open:true}; if (r && o.kind==='series') patch.absence = r.value; setOcc(o, patch); closeModal(); render(); toast('Passet är utlagt som fritt att boka'); },
  setOpen: d => { const o = getOcc(d.id); setOcc(o, {personId:null, open:true}); render(); toast('Utlagt som fritt pass'); },
  setVacant: d => { const o = getOcc(d.id); setOcc(o, {personId:null, open:false}); render(); toast('Passet är tillbakadraget'); },
  openAll: () => { const t0 = today0(); analyze(t0, addDays(t0,55)).occs.filter(o=>o.status==='vacant').forEach(o => setOcc(o, {personId:null, open:true})); render(); toast('Alla vakanta pass är utlagda'); },
  restore: d => { const o = getOcc(d.id); delete D.overrides[o.id]; save(); closeModal(); render(); toast('Återställt till ordinarie'); },
  cancelOcc: d => { const o = getOcc(d.id); setOcc(o, {cancelled:true}); closeModal(); render(); toast('Passet är inställt'); },
  uncancel: d => { const o = getOcc(d.id); setOcc(o, {cancelled:false}); if (o.kind==='series'){ const ov = D.overrides[o.id]; if (ov && !('personId' in ov) && !ov.absence && !ov.open) delete D.overrides[o.id]; save(); } closeModal(); render(); },
  delSingle: d => { const o = getOcc(d.id); D.singles = D.singles.filter(s => s.id!==o.singleId); save(); closeModal(); render(); toast('Extrapasset är borttaget'); },
  newSeries: () => { UI.formErr = null; seriesDialog(null); },
  editSeries: d => { UI.formErr = null; seriesDialog(d.id); },
  newSingle: () => { UI.formErr = null; singleDialog(); },
  preset: d => { syncDraft(); const P = {'223n':{from:'18:00',to:'06:00',cycle:2,days:[[0,1,4,5,6],[2,3]],breakMin:0}, '223d':{from:'06:00',to:'18:00',cycle:2,days:[[0,1,4,5,6],[2,3]],breakMin:0}, 'kontor':{from:'08:00',to:'17:00',cycle:1,days:[[0,1,2,3,4]],breakMin:60}}[d.p]; Object.assign(UI.draft, JSON.parse(JSON.stringify(P))); refreshModal(); },
  parsePattern: () => { const txt = document.getElementById('ptxt').value; syncDraft(); const p = parsePattern(txt); if (!p){ UI.formErr = 'Hittade ingen tid. Skriv t.ex. "18-06 mån-tis fre-sön | ons-tors".'; } else { UI.formErr = null; Object.assign(UI.draft, p); } refreshModal(); },
  saveSeries: () => {
    syncDraft(); const d = UI.draft;
    if (!d.name.trim()) { UI.formErr = 'Ge passet ett namn.'; return refreshModal(); }
    if (!d.start) { UI.formErr = 'Ange från vilket datum passet gäller.'; return refreshModal(); }
    d.days = d.days.slice(0, d.cycle);
    if (!d.days.some(w=>w.length)) { UI.formErr = 'Välj minst en dag i cykeln.'; return refreshModal(); }
    if (d.end && d.end < d.start) { UI.formErr = 'Slutdatum ligger före startdatum.'; return refreshModal(); }
    d.personId = d.personId || null; d.name = d.name.trim();
    if (d.id){ const i = D.series.findIndex(s=>s.id===d.id); D.series[i] = d; } else { d.id = uid('p'); D.series.push(d); }
    save(); UI.formErr = null; closeModal(); render(); toast('Löpande pass sparat');
  },
  askDelSeries: d => { closeModal(); UI.view = 'series'; UI.confirm = 'delSeries:'+d.id; render(); },
  delSeries: d => { D.series = D.series.filter(s=>s.id!==d.id); for (const k of Object.keys(D.overrides)) if (k.startsWith(d.id+'@')) delete D.overrides[k]; UI.confirm = null; save(); render(); toast('Löpande pass borttaget'); },
  confirmCancel: () => { UI.confirm = null; if (UI.modal) refreshModal(); render(); },
  saveSingle: () => {
    const v = id => document.getElementById(id).value;
    const name = v('xName').trim(), date = v('xDate'), mode = v('xMode'), n = Math.min(20, Math.max(1, +v('xCount')||1));
    if (!name) { UI.formErr = 'Ge passet ett namn.'; return refreshModal(); }
    if (!date) { UI.formErr = 'Välj datum.'; return refreshModal(); }
    for (let i=0;i<n;i++) D.singles.push({id:uid('x'), date, from:v('xFrom'), to:v('xTo'), siteId:v('xSite'), name, personId: (mode==='open'||mode==='vacant') ? null : (i===0?mode:null), open: mode==='open' || (mode!=='vacant' && i>0), cancelled:false, breakMin:+v('xBreak')||0, requires:v('xReq')});
    save(); UI.formErr = null; closeModal(); render(); toast(n>1 ? `${n} extrapass skapade` : 'Extrapass skapat');
  },
  editEmp: d => { UI.formErr = null; UI.confirm = null; empDialog(d.id); },
  saveEmp: d => {
    const v = id => document.getElementById(id).value;
    const form = v('eForm'), F = FORMS[form];
    const e = d.id ? empById(d.id) : {id:uid('e')};
    const rec = {name:v('eName').trim(), role:v('eRole'), form, grad: F.pay==='hour' ? 0 : Math.min(100, Math.max(0, +v('eGrad')||0)), lg:v('eLg'), certs:Object.keys(CERTS).filter(k=>document.getElementById('ec_'+k).checked), start:v('eStart'), end:v('eEnd'), phone:v('ePhone').trim(), email:v('eEmail').trim()};
    let err = null;
    if (!rec.name) err = 'Ange namn.';
    else if (F.needsEnd && !rec.end) err = `${F.name} kräver ett slutdatum.`;
    else if (rec.end && rec.start && rec.end < rec.start) err = 'Slutdatum ligger före startdatum.';
    else if (form==='prov' && rec.start && rec.end){ const s = parseISO(rec.start); const max = addDays(new Date(s.getFullYear(), s.getMonth()+6, s.getDate()), -1); if (parseISO(rec.end) > max) err = `Provanställning får vara högst 6 månader (senast ${iso(max)}).`; }
    else if (F.pay==='month' && rec.grad <= 0) err = 'Månadsavlönad anställning behöver en sysselsättningsgrad över 0 %.';
    if (!rec.role || (d.id===UI.user && rec.role!=='arbetsledare' && !D.employees.some(x=>x.id!==d.id && x.role==='arbetsledare'))) err = err || 'Det måste finnas minst en arbetsledare.';
    if (err){ UI.formErr = err; return refreshModal(); }
    Object.assign(e, rec); if (!d.id) D.employees.push(e);
    save(); UI.formErr = null; closeModal(); render(); toast('Personal sparad');
  },
  askDelEmp: d => { if (D.employees.length<=1) return; UI.confirm = 'delEmp:'+d.id; refreshModal(); },
  delEmp: d => {
    if (d.id===UI.user || (empById(d.id).role==='arbetsledare' && D.employees.filter(e=>e.role==='arbetsledare').length<=1)){ UI.formErr = 'Du kan inte ta bort dig själv eller den sista arbetsledaren.'; UI.confirm = null; return refreshModal(); }
    D.employees = D.employees.filter(e=>e.id!==d.id);
    D.series.forEach(s => { if (s.personId===d.id) s.personId = null; });
    D.singles.forEach(s => { if (s.personId===d.id) s.personId = null; });
    for (const o of Object.values(D.overrides)) if (o.personId===d.id) o.personId = null;
    UI.confirm = null; save(); closeModal(); render(); toast('Personal borttagen');
  },
  spec: d => { const e = empById(d.id); const p = calcPay(e, UI.payMonth); const [a] = monthRange(UI.payMonth);
    showModal(() => `<div class="dlg-h"><div><div class="eyebrow">Lönespecifikation · ${MONTHS[a.getMonth()]} ${a.getFullYear()}</div><h2>${esc(e.name)}</h2></div><button class="btn ghost" data-act="closeModal" aria-label="Stäng">✕</button></div><div class="dlg-b">${specHtml(p, UI.payMonth)}</div><div class="dlg-f"><button class="btn" data-act="expSpec" data-id="${e.id}" data-ym="${UI.payMonth}">PDF</button><button class="btn" data-act="closeModal">Stäng</button></div>`, true); },
  bookCheck: d => { const o = getOcc(d.id); UI.bookCheck = {id:d.id, issues: simulate(o, me().id)}; render(); },
  bookCancel: () => { UI.bookCheck = null; render(); },
  book: d => { const o = getOcc(d.id); if (!o || o.status!=='open'){ toast('Passet är inte längre ledigt.'); UI.bookCheck = null; return render(); }
    const is = simulate(o, me().id); if (is.some(i=>i.level==='error')) { UI.bookCheck = {id:d.id, issues:is}; return render(); }
    setOcc(o, {personId: me().id, open:false}); UI.bookCheck = null; render(); toast(`Du har bokat ${o.name} ${fmtD(o.start)}`); },
  addLg: () => { const n = D.settings.lonegrupper.length+1; let id = 'G'+n; while (D.settings.lonegrupper.some(g=>g.id===id)) id += 'b'; D.settings.lonegrupper.push({id, name:'Ny lönegrupp', salary:28000}); save(); render(); },
  delLg: d => { D.settings.lonegrupper.splice(+d.i,1); save(); render(); },
  addSite: () => { D.sites.push({id:uid('s'), name:'Nytt objekt', address:''}); save(); render(); },
  delSite: d => { D.sites.splice(+d.i,1); save(); render(); },
  backup: () => offerFile(`vaktplan-backup-${iso(new Date())}.json`, new Blob([JSON.stringify(D,null,2)], {type:'application/json'})),
  askReset: () => { UI.confirm = 'reset'; render(); },
  doReset: () => { D = seed(); UI.confirm = null; UI.user = 'e1'; save(); render(); toast('Demodata återställd'); },
};
const CHG = {
  who: el => { UI.user = el.value; UI.view = null; UI.bookCheck = null; render(); },
  cand: el => { UI.selCand = el.value || null; UI.pendingForce = null; refreshModal(); },
  draft: () => { syncDraft(); refreshModal(); },
  draftDay: el => { syncDraft(); const w = +el.dataset.w, i = +el.dataset.d; const set = new Set(UI.draft.days[w]||[]); el.checked ? set.add(i) : set.delete(i); UI.draft.days[w] = [...set].sort((a,b)=>a-b); refreshModal(); },
  empForm: el => {
    // behåll inmatade värden när formen byts
    const keep = ['eName','eRole','eGrad','eLg','eStart','eEnd','ePhone','eEmail'].map(id => [id, document.getElementById(id).value]);
    const certs = Object.keys(CERTS).map(k => [k, document.getElementById('ec_'+k).checked]);
    UI.empForm = el.value; refreshModal();
    keep.forEach(([id,v]) => { const x = document.getElementById(id); if (x && !(id==='eGrad' && FORMS[el.value].pay==='hour')) x.value = v; });
    if (FORMS[el.value].pay==='month' && +document.getElementById('eGrad').value===0) document.getElementById('eGrad').value = 100;
    certs.forEach(([k,v]) => { document.getElementById('ec_'+k).checked = v; });
  },
  payMonth: el => { if (el.value){ UI.payMonth = el.value; render(); } },
  myMonth: el => { if (el.value){ UI.myMonth = el.value; render(); } },
  setting: el => {
    const path = el.dataset.path.split('.'); let o = D.settings; for (let i=0;i<path.length-1;i++) o = o[path[i]];
    const k = path[path.length-1]; o[k] = el.type==='number' ? (+el.value||0) : el.value; splitCache.clear(); save(); render();
  },
  lg: el => { const g = D.settings.lonegrupper[+el.dataset.i]; g[el.dataset.f] = el.dataset.f==='salary' ? (+el.value||0) : el.value; save(); render(); },
  site: el => { D.sites[+el.dataset.i][el.dataset.f] = el.value; save(); render(); },
  import: el => {
    const f = el.files && el.files[0]; if (!f) return; const r = new FileReader();
    r.onload = () => { try { const x = JSON.parse(r.result); if (!x.employees || !x.series || !x.settings) throw 0; x.singles = x.singles||[]; x.overrides = x.overrides||{}; x.sites = x.sites||[]; D = x; save(); UI.user = D.employees.find(e=>e.role==='arbetsledare')?.id || D.employees[0].id; render(); toast('Säkerhetskopian är importerad'); } catch(e){ toast('Filen är ingen giltig säkerhetskopia från Vaktplan.'); } };
    r.readAsText(f);
  },
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  if (el.tagName==='TR' && e.target.closest('input,select,a')) return;
  const fn = ACT[el.dataset.act]; if (fn){ e.preventDefault(); fn(el.dataset, el, e); }
});
document.addEventListener('change', e => { const el = e.target.closest('[data-chg]'); if (el && CHG[el.dataset.chg]) CHG[el.dataset.chg](el, e); });
document.addEventListener('keydown', e => { if (e.key==='Escape' && !$('#modal').hidden) closeModal(); });

/* Start */
load();
if (!empById(UI.user)) UI.user = (D.employees.find(e=>e.role==='arbetsledare') || D.employees[0]).id;
UI.schedStart = mondayOf(today0());
UI.payMonth = iso(today0()).slice(0,7);
render();
</script>
